<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 MIDI 音乐播放器</title>
    <style>
        /* ===== 全局样式 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #0b0e14 0%, #1a1f2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 40px;
            padding: 40px 35px 45px;
            max-width: 760px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.02) inset;
        }
        /* ===== 封面 ===== */
        .cover-area {
            text-align: center;
            margin-bottom: 28px;
        }
        .cover-area img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            object-fit: cover;
            background: #1a1f2b;
        }
        .cover-placeholder {
            width: 100%;
            height: 180px;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4d5c7a;
            font-size: 16px;
            border: 1px dashed rgba(255,255,255,0.06);
        }
        /* ===== 标题 ===== */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-weight: 500;
            font-size: 24px;
            color: #f0f3fa;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .header .badge {
            background: rgba(99,140,255,0.18);
            color: #8ab4ff;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(99,140,255,0.15);
            margin-left: auto;
            white-space: nowrap;
        }
        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
            padding: 10px 22px 10px 26px;
            margin-bottom: 22px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .status-text {
            color: #9aa9c9;
            font-size: 15px;
            font-weight: 400;
        }
        .status-text .highlight {
            color: #c8d6f0;
            font-weight: 500;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a4a66;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .status-dot.ready {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74,222,128,0.3);
        }
        .status-dot.loading {
            background: #facc15;
            box-shadow: 0 0 12px rgba(250,204,21,0.3);
            animation: pulse-dot 0.9s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.4; transform:scale(0.7); }
        }
        /* ===== 播放列表 ===== */
        .playlist {
            list-style: none;
            margin-bottom: 25px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            margin-bottom: 6px;
            border-radius: 18px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            color: #c8d2e6;
            font-size: 16px;
            font-weight: 400;
            user-select: none;
        }
        .playlist-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.06);
            transform: translateX(4px);
        }
        .playlist-item.active {
            background: rgba(99,140,255,0.12);
            border-color: rgba(99,140,255,0.2);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(99,140,255,0.05);
        }
        .playlist-item .icon {
            font-size: 22px;
            opacity: 0.6;
            flex-shrink: 0;
            width: 32px;
            text-align: center;
        }
        .playlist-item.active .icon {
            opacity: 1;
        }
        .playlist-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item .status-badge {
            font-size: 12px;
            background: rgba(255,255,255,0.05);
            padding: 2px 12px;
            border-radius: 30px;
            color: #7a8aa8;
            flex-shrink: 0;
        }
        .playlist-item.active .status-badge {
            background: rgba(99,140,255,0.2);
            color: #8ab4ff;
        }
        .playlist-empty {
            text-align: center;
            color: #4d5c7a;
            padding: 40px 20px;
            font-size: 16px;
        }
        .playlist-empty span {
            display: block;
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.4;
        }
        /* ===== 控制栏 ===== */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: #d0daea;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 450;
            cursor: pointer;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            backdrop-filter: blur(4px);
        }
        .btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-1px);
        }
        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background: rgba(99,140,255,0.2);
            border-color: rgba(99,140,255,0.25);
            color: #b8ceff;
        }
        .btn-primary:hover:not(:disabled) {
            background: rgba(99,140,255,0.3);
            border-color: rgba(99,140,255,0.4);
        }
        .btn-danger {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.15);
            color: #fca5a5;
        }
        .btn-danger:hover:not(:disabled) {
            background: rgba(239,68,68,0.22);
            border-color: rgba(239,68,68,0.25);
        }
        .btn .emoji {
            font-size: 18px;
            line-height: 1;
        }
        .spacer {
            flex: 1;
        }
        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.25);
            padding: 4px 16px 4px 18px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .volume-wrap label {
            color: #8899bb;
            font-size: 14px;
            font-weight: 400;
        }
        .volume-wrap input[type="range"] {
            width: 90px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            outline: none;
        }
        .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8ab4ff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 12px rgba(99,140,255,0.2);
        }
        .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #8ab4ff;
            cursor: pointer;
            border: none;
        }
        @media (max-width:600px) {
            .player-card { padding:28px 18px 30px; border-radius:28px; }
            .header h1 { font-size:20px; }
            .header .badge { font-size:11px; padding:2px 12px; }
            .playlist-item { padding:12px 14px; font-size:14px; }
            .controls { gap:8px; }
            .btn { padding:8px 14px; font-size:13px; }
            .volume-wrap { padding:2px 12px 2px 14px; }
            .volume-wrap input[type="range"] { width:60px; }
            .status-bar { padding:8px 16px 8px 20px; font-size:13px; }
            .cover-area img { max-height:180px; }
        }
    </style>
</head>
<body>

<div class="player-card">
    <!-- 封面 -->
    <div class="cover-area" id="coverArea">
        <div class="cover-placeholder" id="coverPlaceholder">🖼️ 暂无封面</div>
        <img id="coverImage" style="display:none; width:100%;" alt="封面">
    </div>

    <!-- 标题 -->
    <div class="header">
        <h1>🎹 MIDI 播放器</h1>
        <span class="badge" id="folderBadge">✨ 在线版</span>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="status-text" id="statusText"><span class="highlight">⏳</span> 加载中…</span>
        <span class="status-dot" id="statusDot"></span>
    </div>

    <!-- 播放列表 -->
    <ul class="playlist" id="playlistContainer">
        <li class="playlist-empty"><span>🎼</span> 加载播放列表...</li>
    </ul>

    <!-- 控制栏 -->
    <div class="controls">
        <button class="btn btn-primary" id="playBtn" disabled><span class="emoji">▶</span> 播放</button>
        <button class="btn btn-danger" id="stopBtn" disabled><span class="emoji">⏹</span> 停止</button>
        <span class="spacer"></span>
        <div class="volume-wrap">
            <label>🔊</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="75">
        </div>
    </div>
</div>

<!-- ====== 使用可靠的 CDN ====== -->
<script type="importmap">
{
    "imports": {
        "spessasynth_lib": "https://cdn.jsdelivr.net/npm/spessasynth_lib@4.3.0/dist/spessasynth_lib.js"
    }
}
</script>

<script type="module">
    // ----- 导入 SpessaSynth -----
    import { Synthetizer, Sequencer, SoundFont2 } from 'spessasynth_lib';
    // 手动指定 worklet 文件（同一 CDN）
    const WORKLET_URL = 'https://cdn.jsdelivr.net/npm/spessasynth_lib@4.3.0/dist/worklet.js';

    // ============================================================
    //  1. DOM 引用
    // ============================================================
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const playlistEl = document.getElementById('playlistContainer');
    const coverImage = document.getElementById('coverImage');
    const coverPlaceholder = document.getElementById('coverPlaceholder');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const volumeSlider = document.getElementById('volumeSlider');

    // ============================================================
    //  2. 状态
    // ============================================================
    let midiList = [];             // { name, fileName }
    let currentIndex = -1;
    let isPlaying = false;

    let synth = null;
    let sequencer = null;
    let audioCtx = null;
    let isSynthReady = false;

    // 图片扩展名（按优先顺序尝试）
    const IMG_EXTS = ['webp', 'jpg', 'jpeg', 'png', 'gif', 'bmp', 'svg'];

    // ============================================================
    //  3. 工具函数
    // ============================================================
    function setStatus(text, type = 'idle') {
        statusText.innerHTML = text;
        statusDot.className = 'status-dot';
        if (type === 'ready') statusDot.classList.add('ready');
        else if (type === 'loading') statusDot.classList.add('loading');
    }

    function setControlsEnabled(enabled) {
        const canPlay = enabled && currentIndex !== -1 && isSynthReady;
        playBtn.disabled = !canPlay;
        stopBtn.disabled = !(enabled && isPlaying && isSynthReady);
    }

    // ============================================================
    //  4. 加载播放列表 (从 index.txt)
    // ============================================================
    async function loadPlaylist() {
        try {
            setStatus('⏳ 加载播放列表…', 'loading');
            const resp = await fetch('index.txt');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const text = await resp.text();

            const lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0 && !line.startsWith('#'));

            if (lines.length === 0) throw new Error('index.txt 为空');

            midiList = lines.map(name => ({
                name: name.replace(/\.mid$/i, ''), // 显示名
                fileName: name                      // 原始文件名（可能含扩展名）
            }));

            renderPlaylist();
            setStatus(`✅ 已加载 <span class="highlight">${midiList.length}</span> 首歌曲`, 'ready');
            setControlsEnabled(true);
        } catch (err) {
            console.error('加载播放列表失败:', err);
            setStatus(`❌ 加载失败: ${err.message}`, 'idle');
            playlistEl.innerHTML = `
                <li class="playlist-empty">
                    <span>⚠️</span>
                    无法加载 index.txt<br>
                    <small style="color:#4d5c7a;">${err.message}</small>
                </li>
            `;
        }
    }

    // ============================================================
    //  5. 渲染播放列表
    // ============================================================
    function renderPlaylist() {
        if (midiList.length === 0) {
            playlistEl.innerHTML = `
                <li class="playlist-empty">
                    <span>📭</span>
                    播放列表为空
                </li>
            `;
            return;
        }

        playlistEl.innerHTML = midiList.map((item, idx) => `
            <li class="playlist-item ${idx === currentIndex ? 'active' : ''}" data-index="${idx}">
                <span class="icon">${idx === currentIndex ? '▶' : '♪'}</span>
                <span class="name">${item.name}</span>
                <span class="status-badge">${idx === currentIndex ? (isPlaying ? '播放中' : '已选') : 'MIDI'}</span>
            </li>
        `).join('');

        playlistEl.querySelectorAll('.playlist-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index, 10);
                if (idx === currentIndex && isPlaying) {
                    // 重新播放
                    stopMusic();
                    setTimeout(() => playMusic(idx), 100);
                } else {
                    stopMusic();
                    playMusic(idx);
                }
            });
        });
    }

    // ============================================================
    //  6. 初始化音色库 (从 CDN)
    // ============================================================
    async function initSynth() {
        try {
            setStatus('🎹 加载音色库…', 'loading');

            // 使用 jsDelivr 加速你的音色库（如果你的仓库是公开的）
            // 如果尚未上传，请替换为你的实际 raw 或 jsDelivr 链接
            const SF2_URL = 'https://cdn.jsdelivr.net/gh/eternallight-debug/life_blog@main/life_blog/12/sound_bank/TimGM6mb.sf2';
            const sf2Resp = await fetch(SF2_URL);
            if (!sf2Resp.ok) throw new Error(`音色库加载失败 HTTP ${sf2Resp.status}`);
            const arrayBuffer = await sf2Resp.arrayBuffer();
            const soundFont = new SoundFont2(arrayBuffer);

            audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            await audioCtx.audioWorklet.addModule(WORKLET_URL);

            const outputNode = audioCtx.createGain();
            outputNode.connect(audioCtx.destination);
            synth = new Synthetizer(outputNode, soundFont);
            synth.setVolume(parseInt(volumeSlider.value, 10) / 100);

            sequencer = new Sequencer(synth);
            sequencer.setLoop(true);

            isSynthReady = true;
            console.log('✅ 音色库初始化成功');
            setStatus('🎵 就绪，点击歌曲播放', 'ready');
            setControlsEnabled(true);
        } catch (err) {
            console.error('音色库初始化失败:', err);
            setStatus(`❌ 音色库加载失败: ${err.message}`, 'idle');
            isSynthReady = false;
            setControlsEnabled(false);
        }
    }

    // ============================================================
    //  7. 加载封面图片（尝试多个扩展名）
    // ============================================================
    function loadCover(displayName) {
        // 尝试构造图片 URL
        let tried = 0;
        let img = new Image();
        img.crossOrigin = 'anonymous'; // 避免 canvas 污染，非必须

        return new Promise((resolve) => {
            const tryNext = (index) => {
                if (index >= IMG_EXTS.length) {
                    // 所有扩展名都尝试失败
                    resolve(null);
                    return;
                }
                const url = `pictures/${displayName}.${IMG_EXTS[index]}`;
                img.onload = () => resolve(url);
                img.onerror = () => {
                    tried++;
                    tryNext(index + 1);
                };
                img.src = url;
            };
            tryNext(0);
        });
    }

    // ============================================================
    //  8. 播放音乐
    // ============================================================
    async function playMusic(index) {
        if (!isSynthReady || !sequencer) {
            console.warn('合成器未就绪');
            return;
        }
        if (index < 0 || index >= midiList.length) return;

        try {
            if (isPlaying) {
                await sequencer.stop();
                isPlaying = false;
            }

            currentIndex = index;
            const item = midiList[index];
            setStatus(`⏳ 加载 <span class="highlight">${item.name}</span>…`, 'loading');

            // 1. 加载 MIDI 文件
            const midiResp = await fetch(`MIDI_files/${item.fileName}`);
            if (!midiResp.ok) throw new Error(`MIDI 加载失败 HTTP ${midiResp.status}`);
            const midiBuffer = await midiResp.arrayBuffer();

            // 2. 加载封面图片（异步尝试）
            const coverUrl = await loadCover(item.name);
            if (coverUrl) {
                coverImage.src = coverUrl;
                coverImage.style.display = 'block';
                coverPlaceholder.style.display = 'none';
            } else {
                coverImage.style.display = 'none';
                coverPlaceholder.style.display = 'flex';
                coverPlaceholder.textContent = '🖼️ 无封面';
            }

            // 3. 加载到 sequencer 并播放
            await sequencer.loadMIDI(midiBuffer);
            sequencer.setLoop(true);
            await sequencer.play();
            isPlaying = true;

            renderPlaylist();
            setStatus(`🎶 正在播放 <span class="highlight">${item.name}</span>`, 'ready');
            setControlsEnabled(true);
            playBtn.innerHTML = `<span class="emoji">⏸</span> 暂停`;

            sequencer.onFinish = () => {
                isPlaying = false;
                renderPlaylist();
                setStatus(`✅ <span class="highlight">${item.name}</span> 播放结束`, 'ready');
                setControlsEnabled(true);
                playBtn.innerHTML = `<span class="emoji">▶</span> 播放`;
            };
        } catch (err) {
            console.error('播放失败:', err);
            setStatus(`❌ 播放失败: ${err.message}`, 'idle');
            isPlaying = false;
            setControlsEnabled(true);
            playBtn.innerHTML = `<span class="emoji">▶</span> 播放`;
        }
    }

    // ============================================================
    //  9. 停止音乐
    // ============================================================
    async function stopMusic() {
        if (sequencer && isPlaying) {
            try {
                await sequencer.stop();
            } catch (e) {}
        }
        isPlaying = false;
        if (currentIndex !== -1) {
            renderPlaylist();
            setStatus(`⏹ 已停止`, 'ready');
        }
        setControlsEnabled(true);
        playBtn.innerHTML = `<span class="emoji">▶</span> 播放`;
    }

    // ============================================================
    //  10. 切换播放/暂停
    // ============================================================
    async function togglePlay() {
        if (!isSynthReady || currentIndex === -1) return;

        if (isPlaying) {
            await sequencer.pause();
            isPlaying = false;
            playBtn.innerHTML = `<span class="emoji">▶</span> 继续`;
            setStatus(`⏸ 已暂停`, 'ready');
            renderPlaylist();
        } else {
            if (sequencer && sequencer.isPaused) {
                await sequencer.play();
                isPlaying = true;
                playBtn.innerHTML = `<span class="emoji">⏸</span> 暂停`;
                setStatus(`🎶 继续播放`, 'ready');
                renderPlaylist();
            } else {
                await playMusic(currentIndex);
            }
        }
        setControlsEnabled(true);
    }

    // ============================================================
    //  11. 事件绑定
    // ============================================================
    volumeSlider.addEventListener('input', () => {
        if (synth) {
            synth.setVolume(parseInt(volumeSlider.value, 10) / 100);
        }
    });

    playBtn.addEventListener('click', togglePlay);

    stopBtn.addEventListener('click', async () => {
        await stopMusic();
        if (sequencer) {
            try { await sequencer.stop(); } catch (e) {}
        }
        isPlaying = false;
        playBtn.innerHTML = `<span class="emoji">▶</span> 播放`;
        renderPlaylist();
        setStatus(`⏹ 已停止`, 'ready');
        setControlsEnabled(true);
    });

    // ============================================================
    //  12. 初始化启动
    // ============================================================
    await loadPlaylist();
    await initSynth();

    // 如果有歌曲，默认选中第一首
    if (midiList.length > 0) {
        currentIndex = 0;
        renderPlaylist();
        setControlsEnabled(true);
    }

    console.log('🎵 MIDI 播放器已启动（线上版）');
</script>
</body>
</html>
