<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的书架</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            padding: 0 16px 40px;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== 顶部搜索栏（固定） ===== */
        .search-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 0 14px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            transition: background 0.3s, border-color 0.3s;
        }

        .search-bar .inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border-radius: 30px;
            border: 1.5px solid #e4e7ed;
            background: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.3s;
            color: #1a1a1a;
        }
        .search-box input::placeholder {
            color: #999;
        }
        .search-box input:focus {
            border-color: #1890ff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.15);
        }
        .search-box .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #aaa;
            pointer-events: none;
        }
        .search-box .clear-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #bbb;
            cursor: pointer;
            padding: 0 4px;
            display: none;
            touch-action: manipulation;
        }
        .search-box .clear-btn.show {
            display: block;
        }
        .search-box .clear-btn:hover {
            color: #666;
        }

        .book-count {
            font-size: 14px;
            color: #888;
            white-space: nowrap;
            padding-right: 4px;
        }

        /* ===== 书架网格 ===== */
        .shelf {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            padding-bottom: 20px;
        }

        .book-card {
            background: #ffffff;
            border-radius: 20px;         /* 卡片圆角 */
            padding: 16px 16px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s, background 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
            position: relative;
            user-select: none;
        }

        .book-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.04);
            background: #fafcff;
        }

        /* ===== 封面图容器 ===== */
        .book-card .cover-wrap {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 0;            /* 取消圆角，图片无圆角 */
            overflow: hidden;
            margin-bottom: 14px;
            background: #eef2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            position: relative;
        }

        .book-card .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
        }

        .book-card .cover-wrap .fallback-icon {
            font-size: 56px;
            color: #8899aa;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.6;
        }

        .book-card .title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1.4;
            margin-bottom: 0;
            word-break: break-word;
        }

        /* ===== 空状态 ===== */
        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }
        .empty-msg .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== 加载状态 ===== */
        .loading-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 16px;
        }
        .loading-msg .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e4e7ed;
            border-top-color: #1890ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 暗色模式 ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background: #141418;
            }
            .search-bar {
                background: rgba(20, 20, 28, 0.78);
                border-bottom-color: rgba(255,255,255,0.04);
            }
            .search-box input {
                background: #25252e;
                border-color: #3a3a44;
                color: #e4e4e7;
            }
            .search-box input::placeholder {
                color: #777;
            }
            .search-box input:focus {
                border-color: #69c0ff;
                box-shadow: 0 0 0 3px rgba(105, 192, 255, 0.15);
            }
            .search-box .icon { color: #777; }
            .search-box .clear-btn { color: #777; }
            .search-box .clear-btn:hover { color: #ccc; }
            .book-count { color: #888; }

            .book-card {
                background: #202028;
                border-color: #2a2a32;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            }
            .book-card:hover {
                background: #282834;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            }
            .book-card .cover-wrap {
                background: #2a2a34;
            }
            .book-card .cover-wrap .fallback-icon {
                color: #667;
            }
            .book-card .title {
                color: #e4e4e7;
            }
            .empty-msg { color: #777; }
            .loading-msg { color: #888; }
        }

        /* ===== 响应式适配 ===== */
        @media (max-width: 640px) {
            .search-bar .inner {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .book-count {
                text-align: center;
            }
            .shelf {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 16px;
            }
            .book-card {
                padding: 12px 12px 14px;
            }
            .book-card .cover-wrap .fallback-icon {
                font-size: 40px;
            }
            .book-card .title {
                font-size: 15px;
            }
        }

        @media (max-width: 400px) {
            .shelf {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
            }
            .book-card .cover-wrap {
                aspect-ratio: 2/3;
            }
            .book-card .cover-wrap .fallback-icon {
                font-size: 32px;
            }
            .book-card .title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部搜索栏（固定） ===== -->
    <header class="search-bar">
        <div class="inner">
            <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索书名..." autocomplete="off">
                <button class="clear-btn" id="clearBtn" aria-label="清空搜索">✕</button>
            </div>
            <div class="book-count" id="bookCount">0 本书</div>
        </div>
    </header>

    <!-- ===== 书架网格 ===== -->
    <div class="shelf" id="shelfContainer">
        <div class="loading-msg">
            <div class="spinner"></div>
            <div>正在加载书单…</div>
        </div>
    </div>

    <script>
        // ================================================================
        //  工具
        // ================================================================
        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return str.replace(/[&<>"']/g, m => map[m]);
        }

        function getFallbackIcon(title) {
            const emojis = ['📕', '📗', '📘', '📙', '📒', '📓', '📔', '📖', '📚', '📜', '📄', '📑', '📰', '🔖'];
            let hash = 0;
            for (let i = 0; i < title.length; i++) {
                hash = (hash * 31 + title.charCodeAt(i)) & 0xffff;
            }
            return emojis[hash % emojis.length] || '📖';
        }

        // ================================================================
        //  主逻辑
        // ================================================================
        const container = document.getElementById('shelfContainer');
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const bookCount = document.getElementById('bookCount');

        let allBooks = [];
        let filteredBooks = [];

        async function loadBooks() {
            const INDEX_FILE = 'index.txt';
            try {
                const resp = await fetch(INDEX_FILE, { cache: 'no-cache' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const text = await resp.text();
                const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));
                if (lines.length === 0) {
                    container.innerHTML = `<div class="empty-msg"><span class="icon">📭</span>书单为空，请在 index.txt 中填写书名（每行一个）</div>`;
                    bookCount.textContent = '0 本书';
                    return;
                }
                allBooks = lines.map(title => ({
                    title: title,
                    fallbackIcon: getFallbackIcon(title)
                }));
                applyFilter('');
            } catch (err) {
                console.error('加载书单失败:', err);
                container.innerHTML = `<div class="empty-msg"><span class="icon">⚠️</span>加载失败：${escapeHtml(err.message)}<br><small>请确保根目录存在 index.txt</small></div>`;
                bookCount.textContent = '0 本书';
            }
        }

        function renderBooks() {
            if (filteredBooks.length === 0) {
                container.innerHTML = `<div class="empty-msg"><span class="icon">🔍</span>没有找到匹配的书籍</div>`;
                bookCount.textContent = '0 本书';
                return;
            }

            let html = '';
            for (const book of filteredBooks) {
                const encoded = encodeURIComponent(book.title);
                const imgSrc = `picture/${encodeURIComponent(book.title)}.webp`;
                const fallback = book.fallbackIcon;

                html += `
                    <div class="book-card" data-book="${encoded}" data-title="${escapeHtml(book.title)}">
                        <div class="cover-wrap">
                            <img src="${imgSrc}" alt="${escapeHtml(book.title)}" loading="lazy"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                            <span class="fallback-icon" style="display:none;">${fallback}</span>
                        </div>
                        <div class="title">${escapeHtml(book.title)}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            bookCount.textContent = `${filteredBooks.length} 本书`;

            container.querySelectorAll('.book-card').forEach(card => {
                card.addEventListener('click', () => {
                    const book = card.dataset.book;
                    window.location.href = `reader.html?book=${book}`;
                });
            });
        }

        function applyFilter(keyword) {
            const kw = keyword.trim().toLowerCase();
            if (kw === '') {
                filteredBooks = allBooks.slice();
            } else {
                filteredBooks = allBooks.filter(book =>
                    book.title.toLowerCase().includes(kw)
                );
            }
            renderBooks();
            clearBtn.classList.toggle('show', kw !== '');
        }

        searchInput.addEventListener('input', function() {
            applyFilter(this.value);
        });

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            applyFilter('');
            searchInput.focus();
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                applyFilter('');
                this.blur();
            }
        });

        loadBooks();
        console.log('📚 书架已加载 — 卡片圆角，封面无圆角');
    </script>
</body>
</html>
