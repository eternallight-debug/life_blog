<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>文档阅读器</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <style>
        /* ===== 基础重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f2f5;
            color: #1a1a1a;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== 汉堡菜单按钮 ===== */
        .hamburger-btn {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 200;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.2s;
            touch-action: manipulation;
        }
        .hamburger-btn:hover {
            background: rgba(255, 255, 255, 0.95);
        }
        .hamburger-btn span {
            width: 24px;
            height: 2.5px;
            background: #222;
            border-radius: 2px;
            transition: 0.25s;
        }
        .hamburger-btn.open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger-btn.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-btn.open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* ===== 控制按钮（齿轮） ===== */
        .control-btn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 150;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
            touch-action: manipulation;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.95);
        }
        .control-btn.active {
            background: #e6f7ff;
            box-shadow: 0 2px 16px rgba(24, 144, 255, 0.20);
        }

        /* ===== 控制面板 ===== */
        .control-panel {
            position: fixed;
            top: 70px;
            right: 14px;
            z-index: 160;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            padding: 16px 18px 14px;
            min-width: 200px;
            max-width: 260px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px) scale(0.96);
            transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .control-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .control-panel .ctrl-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .control-panel .ctrl-group:last-child {
            border-bottom: none;
        }
        .control-panel .ctrl-label {
            font-size: 13px;
            font-weight: 500;
            color: #555;
            min-width: 40px;
            flex-shrink: 0;
        }
        .control-panel .ctrl-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1;
        }
        .ctrl-btn {
            background: #f5f6f8;
            border: none;
            border-radius: 8px;
            padding: 3px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            color: #333;
            line-height: 1.6;
            white-space: nowrap;
        }
        .ctrl-btn:hover {
            background: #e8ecf0;
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        .ctrl-btn.primary {
            background: #1890ff;
            color: #fff;
        }
        .ctrl-btn.primary:hover {
            background: #40a9ff;
        }
        .ctrl-btn.small {
            font-size: 12px;
            padding: 2px 10px;
        }
        .font-size-display {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            min-width: 32px;
            text-align: center;
        }
        .color-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.15s;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .color-dot:hover {
            transform: scale(1.10);
        }
        .color-dot.active {
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.20);
        }
        .color-dot.night-disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }
        .night-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .night-toggle input[type="checkbox"] {
            width: 38px;
            height: 20px;
            border-radius: 12px;
            appearance: none;
            -webkit-appearance: none;
            background: #d0d7de;
            outline: none;
            cursor: pointer;
            transition: 0.25s;
            position: relative;
            flex-shrink: 0;
        }
        .night-toggle input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: 0.25s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        .night-toggle input[type="checkbox"]:checked {
            background: #1890ff;
        }
        .night-toggle input[type="checkbox"]:checked::after {
            left: 20px;
        }
        .night-toggle .night-label {
            font-size: 13px;
            color: #666;
        }

        /* ===== 遮罩 ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.30);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: 0.28s ease;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 70vw;
            max-width: 340px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 20px 14px 30px;
            overflow-y: auto;
            z-index: 101;
            transform: translateX(-100%);
            transition: transform 0.30s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.04);
            -webkit-overflow-scrolling: touch;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .sidebar-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #999;
            padding: 0 6px;
            line-height: 1;
            touch-action: manipulation;
        }
        .sidebar-close:hover {
            color: #333;
        }
        .sidebar-breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            padding: 6px 0 12px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 12px;
            font-size: 13px;
            color: #888;
        }
        .sidebar-breadcrumb .crumb {
            color: #1890ff;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.15s;
            white-space: nowrap;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-breadcrumb .crumb:hover {
            background: #e6f7ff;
        }
        .sidebar-breadcrumb .crumb-sep {
            color: #ccc;
            user-select: none;
        }
        .sidebar-breadcrumb .crumb-last {
            color: #333;
            font-weight: 500;
            cursor: default;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100px;
        }
        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .toc-item {
            margin: 2px 0;
        }
        .toc-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #444;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.12s ease, color 0.12s ease;
            cursor: pointer;
            word-break: break-word;
            line-height: 1.4;
            touch-action: manipulation;
            user-select: none;
        }
        .toc-link:hover {
            background: #f0f4f9;
            color: #1a1a1a;
        }
        .toc-link.active {
            background: #e6f7ff;
            color: #1890ff;
            font-weight: 500;
        }
        .toc-link .toc-icon {
            font-size: 16px;
            flex-shrink: 0;
            width: 22px;
            text-align: center;
        }
        .toc-link .toc-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .toc-link .toc-badge {
            font-size: 11px;
            color: #aaa;
            font-weight: 400;
            flex-shrink: 0;
        }
        .toc-link.active .toc-badge {
            color: #69c0ff;
        }
        .toc-empty {
            padding: 30px 12px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            padding: 80px 20px 50px;
            min-height: 100vh;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            transition: padding 0.3s;
        }
        @media (min-width: 768px) {
            .main-content {
                padding: 90px 48px 60px;
            }
        }

        /* ===== 面包屑（主内容区） ===== */
        .main-breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 0 16px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #e8ecf0;
            font-size: 14px;
            color: #888;
            transition: border-color 0.3s;
        }
        .main-breadcrumb .crumb {
            color: #1890ff;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s;
            font-weight: 500;
        }
        .main-breadcrumb .crumb:hover {
            background: #e6f7ff;
        }
        .main-breadcrumb .crumb-sep {
            color: #ccc;
            user-select: none;
        }
        .main-breadcrumb .crumb-last {
            color: #1a1a1a;
            font-weight: 600;
            cursor: default;
        }

        /* ===== 卡片网格（分册） ===== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            padding: 4px 0 20px;
        }
        .card-item {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 16px 18px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s, background 0.3s;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .card-item:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.04);
            background: #fafcff;
        }
        .card-item:active {
            transform: scale(0.96);
        }
        .card-item .cover-wrap {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 0;
            overflow: hidden;
            background: #eef2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 4px;
        }
        .card-item .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-item .cover-wrap .no-image {
            font-size: 28px;
            font-weight: 600;
            color: #8899aa;
            padding: 8px;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
        }
        .card-item .card-name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            transition: color 0.3s;
            word-break: break-word;
            line-height: 1.4;
        }
        .card-item .card-sub {
            font-size: 13px;
            color: #999;
            transition: color 0.3s;
        }
        .card-item .card-badge {
            font-size: 12px;
            color: #1890ff;
            background: #e6f7ff;
            padding: 2px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* ===== 文件列表（章节） ===== */
        .file-list {
            padding: 0;
            margin: 8px 0 20px;
            list-style: none;
        }
        .file-list .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
            touch-action: manipulation;
            border-bottom: 1px solid #f0f0f0;
        }
        .file-list .file-item:hover {
            background: #f5f8fc;
        }
        .file-list .file-item:active {
            transform: scale(0.98);
        }
        .file-list .file-item .file-icon {
            font-size: 18px;
            flex-shrink: 0;
        }
        .file-list .file-item .file-name {
            font-size: 15px;
            color: #333;
            transition: color 0.3s;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-list .file-item .file-badge {
            font-size: 12px;
            color: #aaa;
            flex-shrink: 0;
        }
        .file-list .file-item.active .file-name {
            color: #1890ff;
            font-weight: 500;
        }

        /* ===== 文章阅读样式 ===== */
        .article-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 16px 0;
            padding-bottom: 14px;
            border-bottom: 2px solid #e8ecf0;
            color: #1a1a1a;
            line-height: 1.3;
            transition: color 0.3s, border-color 0.3s;
        }
        .article-body {
            font-size: 16px;
            line-height: 1.9;
            color: #2c2c2c;
            transition: font-size 0.2s, color 0.3s;
        }
        .article-body p {
            text-indent: 2em;
            margin: 0 0 1.2em 0;
        }
        .article-body p:last-child {
            margin-bottom: 0;
        }
        .article-body h1,
        .article-body h2,
        .article-body h3,
        .article-body h4,
        .article-body h5,
        .article-body h6,
        .article-body ul,
        .article-body ol,
        .article-body blockquote,
        .article-body pre,
        .article-body table,
        .article-body hr,
        .article-body div,
        .article-body figure {
            text-indent: 0;
        }
        .article-body h2 {
            font-size: 22px;
            margin: 1.6em 0 0.6em 0;
            font-weight: 600;
            color: #1a1a1a;
            border-left: 4px solid #1890ff;
            padding-left: 14px;
            transition: color 0.3s, border-color 0.3s;
        }
        .article-body h3 {
            font-size: 18px;
            margin: 1.2em 0 0.4em 0;
            font-weight: 600;
            color: #1a1a1a;
            transition: color 0.3s;
        }
        .article-body ul,
        .article-body ol {
            padding-left: 1.8em;
            margin: 0.6em 0 1.2em 0;
        }
        .article-body li {
            margin: 0.3em 0;
        }
        .article-body blockquote {
            margin: 1em 0;
            padding: 0.6em 1.2em;
            border-left: 4px solid #1890ff;
            background: #f5f8fc;
            border-radius: 0 6px 6px 0;
            color: #3a3a3a;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
        .article-body pre {
            background: #f0f2f5;
            padding: 14px 18px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 14px;
            margin: 1em 0;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            transition: background 0.3s;
        }
        .article-body code {
            font-family: "JetBrains Mono", Consolas, monospace;
            font-size: 0.9em;
            background: #f0f2f5;
            padding: 0.1em 0.4em;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .article-body hr {
            border: none;
            border-top: 1px solid #e8ecf0;
            margin: 2em 0;
            transition: border-color 0.3s;
        }
        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 0.6em 0;
        }
        .article-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            font-size: 0.95em;
        }
        .article-body th,
        .article-body td {
            border: 1px solid #d0d7de;
            padding: 8px 12px;
            text-align: left;
            transition: border-color 0.3s;
        }
        .article-body th {
            background: #f0f4f9;
            font-weight: 600;
            transition: background 0.3s;
        }

        /* ===== 加载 / 错误 / 空状态 ===== */
        .loading-wrap,
        .error-wrap,
        .welcome-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: #999;
            text-align: center;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e4e7ed;
            border-top-color: #1890ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            font-size: 15px;
            color: #888;
        }
        .error-wrap {
            color: #cf3a3a;
        }
        .error-wrap .icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }
        .error-wrap .msg {
            font-size: 16px;
        }
        .welcome-wrap .icon {
            font-size: 56px;
            margin-bottom: 18px;
        }
        .welcome-wrap .title {
            font-size: 22px;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }
        .welcome-wrap .sub {
            font-size: 15px;
            color: #aaa;
        }

        /* ===== 滚动条 ===== */
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #d0d7de;
            border-radius: 10px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #b0b8c0;
        }

        /* ===== 顶部渐变条 ===== */
        .top-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #1890ff, #69c0ff, #1890ff);
            z-index: 300;
            background-size: 200% 100%;
            animation: glowMove 4s linear infinite;
            transition: opacity 0.3s;
        }
        @keyframes glowMove {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }

        /* ===== 夜间模式 ===== */
        body.night-mode {
            background: #141418;
            color: #e4e4e7;
        }
        body.night-mode .hamburger-btn {
            background: rgba(30, 30, 40, 0.80);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }
        body.night-mode .hamburger-btn span {
            background: #d4d4d8;
        }
        body.night-mode .hamburger-btn:hover {
            background: rgba(40, 40, 50, 0.95);
        }
        body.night-mode .control-btn {
            background: rgba(30, 30, 40, 0.80);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            color: #d4d4d8;
        }
        body.night-mode .control-btn:hover {
            background: rgba(40, 40, 50, 0.95);
        }
        body.night-mode .control-btn.active {
            background: #1a3a4a;
        }
        body.night-mode .control-panel {
            background: #1e1e26;
            border-color: #2a2a32;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);

<body>
    <div class="top-glow"></div>
    <button class="hamburger-btn" id="menuBtn" aria-label="切换目录">
        <span></span><span></span><span></span>
    </button>
    <button class="control-btn" id="controlBtn" aria-label="设置">⚙️</button>
    <div class="control-panel" id="controlPanel">
        <div class="ctrl-group">
            <span class="ctrl-label">全屏</span>
            <div class="ctrl-actions">
                <button class="ctrl-btn primary fullscreen-btn" id="fullscreenBtn">⛶ 切换</button>
            </div>
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">字号</span>
            <div class="ctrl-actions">
                <button class="ctrl-btn small" id="fontDecBtn">A-</button>
                <span class="font-size-display" id="fontSizeDisplay">16</span>
                <button class="ctrl-btn small" id="fontIncBtn">A+</button>
            </div>
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">背景</span>
            <div class="ctrl-actions">
                <div class="color-options" id="colorOptions">
                    <span class="color-dot active" data-color="#f0f2f5" style="background:#f0f2f5;border:1px solid #ddd;" title="默认"></span>
                    <span class="color-dot" data-color="#f5f0e8" style="background:#f5f0e8;" title="米白"></span>
                    <span class="color-dot" data-color="#c7edcc" style="background:#c7edcc;" title="豆沙绿"></span>
                    <span class="color-dot" data-color="#d4e8f0" style="background:#d4e8f0;" title="浅蓝"></span>
                    <span class="color-dot" data-color="#ede0f0" style="background:#ede0f0;" title="淡紫"></span>
                </div>
            </div>
        </div>
        <div class="ctrl-group">
            <span class="ctrl-label">夜间</span>
            <div class="ctrl-actions">
                <label class="night-toggle">
                    <input type="checkbox" id="nightModeToggle" />
                    <span class="night-label">关闭</span>
                </label>
            </div>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title" id="sidebarTitle">文档目录</div>
            <button class="sidebar-close" id="closeSidebarBtn" aria-label="关闭目录">✕</button>
        </div>
        <div class="sidebar-breadcrumb" id="sidebarBreadcrumb"></div>
        <ul class="toc-list" id="tocList">
            <li class="toc-empty">加载目录中…</li>
        </ul>
    </aside>
    <main class="main-content" id="mainContent">
        <div class="loading-wrap">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载书籍…</div>
        </div>
    </main>
    <script>
        // ================================================================
        //  配置
        // ================================================================
        const CACHE_KEY_PREFIX = 'doc_cache_';
        const STORAGE_FONT_SIZE = 'reader_font_size';
        const STORAGE_BG_COLOR = 'reader_bg_color';
        const STORAGE_NIGHT_MODE = 'reader_night_mode';
        marked.setOptions({
            gfm: true,
            tables: true,
            breaks: true,
            pedantic: false,
            sanitize: false,
            smartLists: true,
            smartypants: false,
        });

        // ================================================================
        //  获取书籍名称（URL 参数）
        // ================================================================
        function getBookName() {
            const params = new URLSearchParams(window.location.search);
            return params.get('book') || '';
        }
        const BOOK = getBookName();
        if (!BOOK) {
            document.getElementById('mainContent').innerHTML = `
                <div class="error-wrap">
                    <span class="icon">📭</span>
                    <div class="msg">未指定书籍名称<br><small>请从书架点击进入</small></div>
                </div>
            `;
            document.getElementById('tocList').innerHTML = `<li class="toc-empty">无书籍</li>`;
            document.getElementById('sidebarTitle').textContent = '无效书籍';
            throw new Error('缺少 book 参数');
        }
        document.title = `📖 ${BOOK}`;
        document.getElementById('sidebarTitle').textContent = BOOK;

        // ================================================================
        //  状态
        // ================================================================
        let pathStack = [];
        let entries = [];
        let currentReading = null;
        let isLoading = false;
        let sidebarOpen = false;
        let fontSize = 16;
        let bgColor = '#f0f2f5';
        let nightMode = false;

        // DOM 引用
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const tocList = document.getElementById('tocList');
        const sidebarBreadcrumb = document.getElementById('sidebarBreadcrumb');
        const mainContent = document.getElementById('mainContent');
        const controlBtn = document.getElementById('controlBtn');
        const controlPanel = document.getElementById('controlPanel');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fontDecBtn = document.getElementById('fontDecBtn');
        const fontIncBtn = document.getElementById('fontIncBtn');
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const colorOptions = document.getElementById('colorOptions');
        const nightModeToggle = document.getElementById('nightModeToggle');

        // ================================================================
        //  工具函数
        // ================================================================
        function getCacheKey(pathSegments, title) {
            const pathStr = pathSegments.join('/');
            return CACHE_KEY_PREFIX + pathStr + '_' + title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_');
        }

        function getCached(pathSegments, title) {
            try {
                const raw = sessionStorage.getItem(getCacheKey(pathSegments, title));
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.content !== undefined) return data.content;
                    sessionStorage.removeItem(getCacheKey(pathSegments, title));
                    return null;
                }
            } catch (_) { return null; }
            return null;
        }

        function setCache(pathSegments, title, content) {
            try {
                const data = { content, timestamp: Date.now() };
                sessionStorage.setItem(getCacheKey(pathSegments, title), JSON.stringify(data));
            } catch (_) { /* ignore */ }
        }

        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return str.replace(/[&<>"']/g, m => map[m]);
        }

        function resolveFilename(title) {
            let clean = title.replace(/[\\/:*?"<>|]/g, '').trim();
            if (clean.indexOf('.') === -1) clean += '.txt';
            return clean;
        }

        function isHtmlFile(filename) {
            const lower = filename.toLowerCase();
            return lower.endsWith('.html') || lower.endsWith('.htm');
        }

        function joinPath(segments) {
            return segments.join('/');
        }

        // ================================================================
        //  偏好存储
        // ================================================================
        function loadPreferences() {
            try {
                const savedFont = localStorage.getItem(STORAGE_FONT_SIZE);
                if (savedFont) { const v = parseInt(savedFont, 10); if (v >= 12 && v <= 28) fontSize = v; }
                const savedBg = localStorage.getItem(STORAGE_BG_COLOR);
                if (savedBg && /^#[0-9a-f]{6}$/i.test(savedBg)) bgColor = savedBg;
                const savedNight = localStorage.getItem(STORAGE_NIGHT_MODE);
                if (savedNight === 'true') nightMode = true;
                else if (savedNight === 'false') nightMode = false;
            } catch (_) {}
        }

        function saveFontSize() { try { localStorage.setItem(STORAGE_FONT_SIZE, String(fontSize)); } catch (_) {} }

        function saveBgColor() { try { localStorage.setItem(STORAGE_BG_COLOR, bgColor); } catch (_) {} }

        function saveNightMode() { try { localStorage.setItem(STORAGE_NIGHT_MODE, String(nightMode)); } catch (_) {} }

        // ================================================================
        //  应用偏好
        // ================================================================
        function applyPreferences() {
            if (nightMode) {
                document.body.classList.add('night-mode');
                nightModeToggle.checked = true;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.add('night-disabled'));
                document.querySelector('.night-toggle .night-label').textContent = '开启';
            } else {
                document.body.classList.remove('night-mode');
                nightModeToggle.checked = false;
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('night-disabled'));
                document.querySelector('.night-toggle .night-label').textContent = '关闭';
            }
            if (!nightMode) {
                document.body.style.background = bgColor;
                document.querySelectorAll('.color-dot').forEach(dot => {
                    dot.classList.toggle('active', dot.dataset.color === bgColor);
                });
            } else {
                document.body.style.background = '';
                document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            }
            const bodyEl = document.querySelector('.article-body');
            if (bodyEl) bodyEl.style.fontSize = fontSize + 'px';
            fontSizeDisplay.textContent = fontSize;
        }

        // ================================================================
        //  侧边栏
        // ================================================================
        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('show');
            menuBtn.classList.add('open');
            sidebarOpen = true;
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
            menuBtn.classList.remove('open');
            sidebarOpen = false;
            document.body.style.overflow = '';
        }

        function toggleSidebar() {
            if (sidebarOpen) closeSidebar();
            else openSidebar();
        }
        menuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', closeSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);

        // ================================================================
        //  控制面板
        // ================================================================
        let panelOpen = false;

        function togglePanel(e) {
            e.stopPropagation();
            panelOpen = !panelOpen;
            controlPanel.classList.toggle('open', panelOpen);
            controlBtn.classList.toggle('active', panelOpen);
        }

        function closePanel() {
            panelOpen = false;
            controlPanel.classList.remove('open');
            controlBtn.classList.remove('active');
        }
        controlBtn.addEventListener('click', togglePanel);
        document.addEventListener('click', function(e) {
            if (panelOpen && !controlPanel.contains(e.target) && e.target !== controlBtn) closePanel();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { if (panelOpen) closePanel(); if (sidebarOpen) closeSidebar(); }
        });

        // ================================================================
        //  全屏
        // ================================================================
        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            closePanel();
        });

        function updateFullscreenBtn() {
            const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
            fullscreenBtn.textContent = isFull ? '⛶ 退出' : '⛶ 切换';
        }
        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
        updateFullscreenBtn();

        // ================================================================
        //  字号
        // ================================================================
        function changeFontSize(delta) {
            const newSize = Math.min(45, Math.max(6, fontSize + delta));
            if (newSize === fontSize) return;
            fontSize = newSize;
            saveFontSize();
            const bodyEl = document.querySelector('.article-body');
            if (bodyEl) bodyEl.style.fontSize = fontSize + 'px';
            fontSizeDisplay.textContent = fontSize;
        }
        fontDecBtn.addEventListener('click', e => { e.stopPropagation();
            changeFontSize(-2); });
        fontIncBtn.addEventListener('click', e => { e.stopPropagation();
            changeFontSize(2); });

        // ================================================================
        //  背景色
        // ================================================================
        colorOptions.addEventListener('click', function(e) {
            const dot = e.target.closest('.color-dot');
            if (!dot || nightMode) return;
            const color = dot.dataset.color;
            if (!color) return;
            bgColor = color;
            saveBgColor();
            document.body.style.background = bgColor;
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
            closePanel();
        });

        // ================================================================
        //  夜间模式
        // ================================================================
        nightModeToggle.addEventListener('change', function() {
            nightMode = this.checked;
            saveNightMode();
            applyPreferences();
            if (nightMode) {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                document.body.style.background = '';
            } else {
                document.body.style.background = bgColor;
                document.querySelectorAll('.color-dot').forEach(dot => {
                    dot.classList.toggle('active', dot.dataset.color === bgColor);
                });
            }
            document.querySelector('.night-toggle .night-label').textContent = nightMode ? '开启' : '关闭';
            closePanel();
        });

        // ================================================================
        //  核心功能：加载目录
        // ================================================================
        async function loadDirectory(segments) {
            if (isLoading) return;
            isLoading = true;
            const pathStr = joinPath(segments);
            const indexUrl = pathStr ? `${BOOK}/${pathStr}/index.txt` : `${BOOK}/index.txt`;

            mainContent.innerHTML = `
                <div class="loading-wrap">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">加载目录中…</div>
                </div>
            `;
            tocList.innerHTML = `<li class="toc-empty">加载中…</li>`;

            try {
                const resp = await fetch(indexUrl, { cache: 'no-cache' });
                if (!resp.ok) throw new Error(`无法读取 index.txt (HTTP ${resp.status})`);

                const text = await resp.text();
                const lines = text.split(/\r?\n/).map(s => s.trim()).filter(s => s && !s.startsWith('#'));

                if (lines.length === 0) {
                    entries = [];
                    renderDirectory();
                    isLoading = false;
                    return;
                }

                entries = lines.map(line => {
                    const isFolder = line.endsWith('/');
                    const name = isFolder ? line.slice(0, -1) : line;
                    const filename = isFolder ? '' : resolveFilename(name);
                    return { name, isFolder, filename };
                });

                pathStack = segments;
                renderDirectory();
                updateSidebar();
                if (currentReading && currentReading.path !== joinPath(segments)) {
                    currentReading = null;
                }
                isLoading = false;
            } catch (err) {
                console.error('加载目录失败:', err);
                mainContent.innerHTML = `
                    <div class="error-wrap">
                        <span class="icon">⚠️</span>
                        <div class="msg">加载目录失败<br><small>${escapeHtml(err.message)}</small></div>
                    </div>
                `;
                tocList.innerHTML = `<li class="toc-empty">加载失败</li>`;
                isLoading = false;
            }
        }

        // ================================================================
        //  渲染：目录视图
        // ================================================================
        function renderDirectory() {
            const folders = entries.filter(e => e.isFolder);
            const files = entries.filter(e => !e.isFolder);

            let html = '';
            html += renderBreadcrumbHTML();

            const currentName = pathStack.length > 0 ? pathStack[pathStack.length - 1] : BOOK;
            html += `<div style="font-size:22px;font-weight:600;margin-bottom:6px;color:#1a1a1a;transition:color 0.3s;">${escapeHtml(currentName)}</div>`;
            html += `<div style="font-size:14px;color:#999;margin-bottom:20px;transition:color 0.3s;">共 ${entries.length} 项</div>`;

            if (entries.length === 0) {
                html += `<div class="welcome-wrap"><span class="icon">📭</span><div class="title">目录为空</div></div>`;
                mainContent.innerHTML = html;
                applyPreferencesToContent();
                return;
            }

            // 文件夹卡片
            if (folders.length > 0) {
                html += `<div style="font-size:15px;font-weight:500;color:#666;margin:4px 0 12px;">分册</div>`;
                html += `<div class="cards-grid">`;
                for (const f of folders) {
                    // 构建当前路径前缀（相对于书籍根目录）
                    const basePath = pathStack.length ? `${BOOK}/${pathStack.join('/')}` : `${BOOK}`;
                    const coverPath = `${basePath}/picture/${encodeURIComponent(f.name)}.webp`;
                    html += `
                        <div class="card-item" data-folder="${escapeHtml(f.name)}">
                            <div class="cover-wrap">
                                <img src="${coverPath}" alt="${escapeHtml(f.name)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                                <div class="no-image" style="display:none;">${escapeHtml(f.name)}</div>
                            </div>
                            <div class="card-name">${escapeHtml(f.name)}</div>
                            <div class="card-sub">点击进入</div>
                        </div>
                    `;
                }
                html += `</div>`;
            }

            // 章节列表
            if (files.length > 0) {
                html += `<div style="font-size:15px;font-weight:500;color:#666;margin:20px 0 8px;">章节</div>`;
                html += `<ul class="file-list">`;
                for (const f of files) {
                    const isActive = currentReading && currentReading.name === f.name && currentReading.path === joinPath(
                    pathStack);
                    const cached = getCached(pathStack, f.name) !== null;
                    html += `
                        <li class="file-item ${isActive ? 'active' : ''}" data-filename="${escapeHtml(f.filename)}" data-name="${escapeHtml(f.name)}">
                            <span class="file-icon">📄</span>
                            <span class="file-name">${escapeHtml(f.name)}</span>
                            ${cached ? `<span class="file-badge">✓</span>` : ''}
                        </li>
                    `;
                }
                html += `</ul>`;
            }

            mainContent.innerHTML = html;
            applyPreferencesToContent();

            // 卡片点击
            document.querySelectorAll('.card-item').forEach(el => {
                el.addEventListener('click', function() {
                    const folderName = this.dataset.folder;
                    if (folderName) navigateToFolder(folderName);
                });
            });

            // 文件点击
            document.querySelectorAll('.file-item').forEach(el => {
                el.addEventListener('click', function() {
                    const filename = this.dataset.filename;
                    const name = this.dataset.name;
                    if (filename && name) loadArticle(name, filename);
                });
            });

            updateSidebar();
        }

        // ================================================================
        //  渲染文章
        // ================================================================
        function renderArticle(item) {
            if (!item || !item.content) {
                mainContent.innerHTML = `<div class="error-wrap"><span class="icon">📭</span><div class="msg">内容为空</div></div>`;
                return;
            }
            let bodyHtml = marked.parse(item.content);
            let html = '';
            html += renderBreadcrumbHTML();
            html += `
                <div class="article-title">${escapeHtml(item.name)}</div>
                <div class="article-body">${bodyHtml}</div>
            `;
            mainContent.innerHTML = html;
            applyPreferencesToContent();
            const bodyEl = document.querySelector('.article-body');
            if (bodyEl) bodyEl.style.fontSize = fontSize + 'px';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateSidebar();
        }

        // ================================================================
        //  面包屑 HTML
        // ================================================================
        function renderBreadcrumbHTML() {
            const segments = pathStack;
            if (!segments || segments.length === 0) {
                return `<div class="main-breadcrumb"><span class="crumb-last">${escapeHtml(BOOK)}</span></div>`;
            }
            let html = `<div class="main-breadcrumb">`;
            html += `<span class="crumb" data-path="root">${escapeHtml(BOOK)}</span>`;
            for (let i = 0; i < segments.length; i++) {
                html += `<span class="crumb-sep"> › </span>`;
                const isLast = (i === segments.length - 1);
                const pathUpTo = segments.slice(0, i + 1);
                if (isLast) {
                    html += `<span class="crumb-last">${escapeHtml(segments[i])}</span>`;
                } else {
                    html += `<span class="crumb" data-path="${escapeHtml(joinPath(pathUpTo))}">${escapeHtml(segments[i])}</span>`;
                }
            }
            html += `</div>`;
            return html;
        }

        // ================================================================
        //  更新侧边栏
        // ================================================================
        function updateSidebar() {
            updateSidebarBreadcrumb();

            if (!entries || entries.length === 0) {
                tocList.innerHTML = `<li class="toc-empty">目录为空</li>`;
                return;
            }

            let html = '';
            for (const entry of entries) {
                const icon = entry.isFolder ? '📕' : '📄';
                const isActive = !entry.isFolder && currentReading && currentReading.name === entry.name &&
                    currentReading.path === joinPath(pathStack);
                const cached = !entry.isFolder && getCached(pathStack, entry.name) !== null;
                html += `
                    <li class="toc-item">
                        <span class="toc-link ${isActive ? 'active' : ''}" data-name="${escapeHtml(entry.name)}" data-folder="${entry.isFolder ? 'true' : 'false'}" data-filename="${escapeHtml(entry.filename)}">
                            <span class="toc-icon">${icon}</span>
                            <span class="toc-name">${escapeHtml(entry.name)}</span>
                            ${cached ? `<span class="toc-badge">✓</span>` : ''}
                        </span>
                    </li>
                `;
            }
            tocList.innerHTML = html;

            tocList.querySelectorAll('.toc-link').forEach(el => {
                el.addEventListener('click', function() {
                    const isFolder = this.dataset.folder === 'true';
                    const name = this.dataset.name;
                    if (!name) return;
                    if (isFolder) {
                        navigateToFolder(name);
                    } else {
                        const filename = this.dataset.filename;
                        if (filename) loadArticle(name, filename);
                    }
                    if (window.innerWidth < 768) closeSidebar();
                });
            });
        }

        function updateSidebarBreadcrumb() {
            const segments = pathStack;
            if (!segments || segments.length === 0) {
                sidebarBreadcrumb.innerHTML = `<span class="crumb-last">${escapeHtml(BOOK)}</span>`;
                return;
            }
            let html = '';
            html += `<span class="crumb" data-path="root">${escapeHtml(BOOK)}</span>`;
            for (let i = 0; i < segments.length; i++) {
                html += `<span class="crumb-sep"> › </span>`;
                const isLast = (i === segments.length - 1);
                const pathUpTo = segments.slice(0, i + 1);
                if (isLast) {
                    html += `<span class="crumb-last">${escapeHtml(segments[i])}</span>`;
                } else {
                    html += `<span class="crumb" data-path="${escapeHtml(joinPath(pathUpTo))}">${escapeHtml(segments[i])}</span>`;
                }
            }
            sidebarBreadcrumb.innerHTML = html;

            sidebarBreadcrumb.querySelectorAll('.crumb').forEach(el => {
                el.addEventListener('click', function() {
                    const path = this.dataset.path;
                    if (path === 'root') {
                        navigateToRoot();
                    } else {
                        const segs = path.split('/');
                        navigateToPath(segs);
                    }
                    if (window.innerWidth < 768) closeSidebar();
                });
            });
        }

        // ================================================================
        //  导航
        // ================================================================
        function navigateToFolder(folderName) {
            const newPath = [...pathStack, folderName];
            currentReading = null;
            loadDirectory(newPath);
        }

        function navigateToPath(segments) {
            currentReading = null;
            loadDirectory(segments);
        }

        function navigateToRoot() {
            currentReading = null;
            loadDirectory([]);
        }

        function goBack() {
            if (pathStack.length === 0) return;
            const newPath = pathStack.slice(0, -1);
            currentReading = null;
            loadDirectory(newPath);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !e.target.matches('input, textarea, [contenteditable]')) {
                if (pathStack.length > 0 && !currentReading) {
                    goBack();
                    e.preventDefault();
                } else if (pathStack.length > 0 && currentReading) {
                    currentReading = null;
                    loadDirectory(pathStack);
                    e.preventDefault();
                }
            }
        });

        // ================================================================
        //  加载文章
        // ================================================================
        async function loadArticle(name, filename) {
            if (isLoading) return;
            if (isHtmlFile(filename)) {
                const filePath = joinPath(pathStack) + '/' + encodeURIComponent(filename);
                window.location.href = `${BOOK}/${filePath}`;
                return;
            }

            if (currentReading && currentReading.name === name && currentReading.path === joinPath(pathStack)) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            isLoading = true;
            const currentPath = joinPath(pathStack);

            mainContent.innerHTML = `
                <div class="loading-wrap">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">加载《${escapeHtml(name)}》…</div>
                </div>
            `;

            try {
                let content = getCached(pathStack, name);
                if (content !== null) {
                    currentReading = { name, content, filename, path: currentPath };
                    renderArticle(currentReading);
                    updateSidebar();
                    isLoading = false;
                    refreshInBackground(name, filename);
                    return;
                }

                const filePath = currentPath ? `${BOOK}/${currentPath}/${encodeURIComponent(filename)}` : `${BOOK}/${encodeURIComponent(filename)}`;
                const response = await fetch(filePath, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                content = await response.text();
                setCache(pathStack, name, content);
                currentReading = { name, content, filename, path: currentPath };
                renderArticle(currentReading);
                updateSidebar();
            } catch (err) {
                console.error('加载文章失败:', err);
                mainContent.innerHTML = `
                    <div class="error-wrap">
                        <span class="icon">⚠️</span>
                        <div class="msg">加载《${escapeHtml(name)}》失败<br><small>${escapeHtml(err.message)}</small></div>
                    </div>
                `;
            }
            isLoading = false;
        }

        async function refreshInBackground(name, filename) {
            try {
                const currentPath = joinPath(pathStack);
                const filePath = currentPath ? `${BOOK}/${currentPath}/${encodeURIComponent(filename)}?_t=${Date.now()}` : `${BOOK}/${encodeURIComponent(filename)}?_t=${Date.now()}`;
                const response = await fetch(filePath, { cache: 'no-cache' });
                if (!response.ok) return;
                const newContent = await response.text();
                if (newContent !== currentReading?.content) {
                    setCache(pathStack, name, newContent);
                    if (currentReading && currentReading.name === name && currentReading.path === joinPath(pathStack)) {
                        currentReading.content = newContent;
                        renderArticle(currentReading);
                        updateSidebar();
                    }
                }
            } catch (_) { /* 静默 */ }
        }

        // ================================================================
        //  应用偏好到内容
        // ================================================================
        function applyPreferencesToContent() {
            if (nightMode) {
                document.body.classList.add('night-mode');
            } else {
                document.body.classList.remove('night-mode');
                document.body.style.background = bgColor;
            }
            const bodyEl = document.querySelector('.article-body');
            if (bodyEl) bodyEl.style.fontSize = fontSize + 'px';
        }

        // ================================================================
        //  初始化
        // ================================================================
        async function init() {
            loadPreferences();
            applyPreferences();
            try {
                await loadDirectory([]);
            } catch (err) {
                console.error('初始化失败:', err);
                mainContent.innerHTML = `
                    <div class="error-wrap">
                        <span class="icon">⚠️</span>
                        <div class="msg">加载书籍失败<br><small>${escapeHtml(err.message)}</small></div>
                    </div>
                `;
                tocList.innerHTML = `<li class="toc-empty">加载失败</li>`;
            }
        }

        init();
        console.log(`📖 阅读器已启动，书籍：${BOOK}`);
    </script>
</body>
</html>
