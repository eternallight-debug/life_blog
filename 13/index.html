<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>记忆卡片</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:contain}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0a0e17;color:#e8eefc;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    height:100vh;height:100dvh;
    max-width:560px;margin:0 auto;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:12px;
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
  .brand{font-size:13px;font-weight:600;color:#5f7299;letter-spacing:3px}
  .text-btn{
    background:transparent;border:none;color:#4a5b7a;
    font-size:12px;cursor:pointer;font-family:inherit;
    padding:4px 6px;border-radius:6px;transition:.15s;
  }
  .text-btn:hover{color:#7fd1ff}
  .meta{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:#5f7299;min-height:18px;
  }
  .meta .count{color:#7c8db0}
  .meta .pos{color:#7fd1ff;font-weight:600}

  .toolbar{display:flex;gap:6px;flex:0 0 auto}
  .sel{position:relative;min-width:0}
  .sel::after{
    content:'';position:absolute;right:10px;top:50%;
    width:5px;height:5px;
    border-right:1.5px solid #4a5b7a;border-bottom:1.5px solid #4a5b7a;
    transform:translateY(-70%) rotate(45deg);
    pointer-events:none;transition:.15s;
  }
  .sel:hover::after{border-color:#7c8db0}
  .sel-group{flex:1.6}
  .sel-file {flex:1.1}
  .sel-face {flex:.9}
  .sel-mode {flex:1.1}
  select{
    appearance:none;width:100%;
    background:#111827;border:1px solid #1c2740;color:#e8eefc;
    padding:9px 22px 9px 10px;border-radius:10px;
    font-size:12.5px;font-family:inherit;
    cursor:pointer;outline:none;transition:.15s;
    text-overflow:ellipsis;
  }
  select:hover{border-color:#2a3a56}
  select:focus{border-color:#3b82f6;background:#131c2e}
  select:disabled{opacity:.5;cursor:not-allowed}
  select option{background:#111827;color:#e8eefc}

  .search{
    display:flex;align-items:center;gap:6px;flex:0 0 auto;
    background:#111827;border:1px solid #1c2740;border-radius:10px;
    padding:0 12px;height:36px;transition:.15s;
  }
  .search:focus-within{border-color:#3b82f6;background:#131c2e}
  .search input{
    flex:1;background:none;border:none;outline:none;
    color:#e8eefc;font-size:12.5px;font-family:inherit;
    height:100%;min-width:0;
  }
  .search input::placeholder{color:#3d4c6b}
  .clear{
    background:none;border:none;color:#4a5b7a;
    cursor:pointer;font-size:11px;padding:3px 5px;
    font-family:inherit;flex:0 0 auto;border-radius:5px;transition:.15s;
  }
  .clear:hover{color:#e8eefc;background:#1a2438}
  .clear.hidden{display:none}

  .stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .card{
    flex:1 1 auto;min-height:0;
    background:radial-gradient(circle at 50% 0%,#182338 0%,#0d1422 80%);
    border:1px solid #1c2740;border-radius:24px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:32px 24px;gap:20px;
    overflow:auto;user-select:none;position:relative;
  }
  .face-text{
    font-size:clamp(28px,8vw,46px);font-weight:600;
    text-align:center;line-height:1.35;
    word-break:break-word;max-width:100%;
    letter-spacing:-.5px;
  }
  .face-text.muted{
    color:#3d4c6b;font-size:clamp(14px,4vw,16px);
    font-weight:400;letter-spacing:0;
    line-height:1.7;padding:0 12px;
  }
  .answer{
    width:100%;display:flex;flex-direction:column;
    align-items:center;gap:20px;
    animation:pop .25s cubic-bezier(.2,.9,.3,1);
  }
  .answer.hidden{display:none}
  .answer .hr{width:36px;height:2px;border-radius:2px;background:#2a3a56}
  .answer .face-text{font-size:clamp(20px,5.8vw,34px);color:#7fd1ff;font-weight:500}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card.memory .answer{animation:none}

  .actions{display:flex;gap:8px;flex:0 0 auto;padding-top:2px}
  .btn{
    flex:1;padding:15px 10px;border-radius:14px;
    border:1px solid #1c2740;background:#111827;color:#e8eefc;
    font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:.15s;white-space:nowrap;letter-spacing:.5px;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(180deg,#2e6fe8,#2358c9);border-color:#2e6fe8;color:#fff}
  .btn.primary:hover{background:linear-gradient(180deg,#3b82f6,#2563eb)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:active{transform:none}
  .btn.hidden{display:none}

  .app.immersive{max-width:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .app.immersive .topbar,
  .app.immersive .meta,
  .app.immersive .toolbar,
  .app.immersive .search{display:none}

  .exit-immersive{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:40;
    background:rgba(17,24,39,.9);border:1px solid #1c2740;color:#7c8db0;
    padding:7px 14px;border-radius:10px;font-size:12px;cursor:pointer;
    font-family:inherit;backdrop-filter:blur(10px);transition:.15s;
  }
  .exit-immersive:hover{color:#e8eefc;border-color:#3b82f6}
  .exit-immersive.hidden{display:none}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">记忆卡片</div>
    <button class="text-btn" id="btnImmersive">沉浸</button>
  </header>

  <div class="meta">
    <span class="count" id="metaCount">正在读取</span>
    <span class="pos"  id="metaPos"></span>
  </div>

  <div class="toolbar">
    <div class="sel sel-group"><select id="selGroup"></select></div>
    <div class="sel sel-file"><select id="selFile"></select></div>
    <div class="sel sel-face">
      <select id="selFace" title="正面显示">
        <option value="key">键</option>
        <option value="value">值</option>
      </select>
    </div>
    <div class="sel sel-mode">
      <select id="selMode" title="模式">
        <option value="memory">记忆</option>
        <option value="recite">背诵</option>
      </select>
    </div>
  </div>

  <div class="search">
    <input id="searchInput" type="search" placeholder="搜索" autocomplete="off" spellcheck="false">
    <button class="clear hidden" id="searchClear">清空</button>
  </div>

  <main class="stage">
    <div class="card" id="cardBox">
      <div class="face-text muted" id="faceText">正在读取</div>
      <div class="answer hidden" id="answerBox">
        <div class="hr"></div>
        <div class="face-text" id="backText"></div>
      </div>
    </div>
  </main>

  <footer class="actions">
    <button class="btn" id="btnPrev">上一个</button>
    <button class="btn primary" id="btnReveal">显示值</button>
    <button class="btn" id="btnNext">下一个</button>
  </footer>
</div>

<button class="exit-immersive hidden" id="exitImmersive">退出沉浸</button>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  const els = {
    app:$('app'), metaCount:$('metaCount'), metaPos:$('metaPos'),
    selGroup:$('selGroup'), selFile:$('selFile'),
    selFace:$('selFace'), selMode:$('selMode'),
    search:$('searchInput'), clear:$('searchClear'),
    cardBox:$('cardBox'), faceText:$('faceText'),
    backText:$('backText'), answerBox:$('answerBox'),
    btnPrev:$('btnPrev'), btnReveal:$('btnReveal'), btnNext:$('btnNext'),
    btnImmersive:$('btnImmersive'), exitImm:$('exitImmersive'),
  };

  const state = {
    entries: [],
    groups: {},        // groupKey -> [entry] （按 index 排好）
    showDeck: false,   // 有多个 deck 时，分组名带 deck
    cards: [], queue: [], pos: 0,
    revealed: false, face: 'key', mode: 'memory',
    query: '', immersive: false, status: 'loading',
    groupKey: null,    // 当前分组 key；null = 全部
    fileRaw:  null,    // 当前文件 raw；null = 该组全部
  };

  const MAX_DEPTH = 6;

  /* ================= 路径解析 =================
       eng/A/1.txt  ┐
       eng/A-1.txt  ├─ deck=eng  letter=A  index=1
       eng-A-1.txt  ┘
       A-1.txt       ─ deck=''   letter=A  index=1
       A/1.txt       ─ deck=''   letter=A  index=1
  ================================================ */
  function parseEntry(raw) {
    const s = String(raw).replace(/\\/g, '/').trim();
    if (!/\.txt$/i.test(s)) return null;

    const body  = s.replace(/\.txt$/i, '');
    const parts = body.split(/[\/\-_]+/).filter(Boolean);
    if (parts.length < 2) return null;

    const idxStr = parts[parts.length - 1];
    const letStr = parts[parts.length - 2];

    if (!/^\d+$/.test(idxStr))     return null;
    if (!/^[A-Za-z]$/.test(letStr)) return null;

    return {
      raw: s,
      deck:   parts.slice(0, -2).join('/'),
      letter: letStr.toUpperCase(),
      index:  parseInt(idxStr, 10),
      url:    './' + s.split('/').map(encodeURIComponent).join('/'),
    };
  }

  /* ================= 工具 ================= */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  const NATURAL_CMP = (() => {
    if (typeof Intl !== 'undefined' && Intl.Collator) {
      const c = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
      return (a, b) => c.compare(String(a), String(b));
    }
    return (a, b) => String(a).localeCompare(String(b), undefined, { numeric: true });
  })();

  const VALID_KEY = /^[A-Za-z][A-Za-z0-9 .'\-]*$/;
  const BAD_CHARS = /[{}<>;=]/;

  function parseKeyValue(text) {
    const list = [];
    for (const raw of text.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith('//') || line.startsWith('#')) continue;
      if (BAD_CHARS.test(line)) continue;
      const i = line.search(/[:：]/);
      if (i < 0) continue;
      const k = line.slice(0, i).trim();
      const v = line.slice(i + 1).trim();
      if (!k || !v || !VALID_KEY.test(k)) continue;
      list.push({ key: k, value: v });
    }
    return list;
  }

  async function fetchText(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  }

  /* ================= 递归读取 index.txt ================= */
  async function loadIndex() {
    const entries = [];
    const seen = new Set();

    async function walk(base, depth) {
      if (depth > MAX_DEPTH) return;

      const url = base
        ? './' + base.split('/').map(encodeURIComponent).join('/') + '/index.txt'
        : './index.txt';

      let text;
      try {
        text = await fetchText(url);
      } catch (e) {
        if (base) return;
        throw e;
      }

      const lines = text.split(/\r?\n/)
        .map(s => s.trim())
        .filter(s => s && !s.startsWith('//') && !s.startsWith('#'));

      for (const line of lines) {
        const clean = line.replace(/^\.\//, '').replace(/\/+$/, '');
        if (!clean) continue;
        const full = base ? base + '/' + clean : clean;

        if (/\.txt$/i.test(clean)) {
          const e = parseEntry(full);
          if (e && !seen.has(e.raw)) {
            seen.add(e.raw);
            entries.push(e);
          }
        } else {
          await walk(full, depth + 1);
        }
      }
    }

    await walk('', 0);

    // 是否有多个 deck
    const decks = new Set(entries.map(e => e.deck).filter(Boolean));
    const showDeck = decks.size > 1;

    // 分组
    const groups = {};
    for (const e of entries) {
      const key = showDeck
        ? (e.deck ? e.deck + '|' + e.letter : e.letter)
        : e.letter;
      (groups[key] ||= []).push(e);
    }
    for (const k of Object.keys(groups)) {
      groups[k].sort((a, b) => a.index - b.index || a.raw.localeCompare(b.raw));
    }

    return { entries, groups, showDeck };
  }

  /* ================= 当前要加载的文件 ================= */
  function currentFiles() {
    if (state.groupKey === null) return state.entries;
    const g = state.groups[state.groupKey] || [];
    if (state.fileRaw === null) return g;
    return g.filter(e => e.raw === state.fileRaw);
  }

  /* ================= 加载当前选择 ================= */
  async function loadCurrent() {
    const files = currentFiles();

    state.status = 'loading';
    state.cards = []; state.queue = [];
    state.pos = 0; state.revealed = false;

    els.metaCount.textContent = `正在读取 ${files.length} 个文件…`;
    render();

    const all = [];
    for (let i = 0; i < files.length; i++) {
      try {
        const text = await fetchText(files[i].url);
        all.push(...parseKeyValue(text));
      } catch (e) {
        console.warn('跳过 ' + files[i].raw, e);
      }
      if ((i + 1) % 5 === 0 || i === files.length - 1) {
        els.metaCount.textContent = `正在读取 ${i + 1}/${files.length}…`;
      }
    }

    state.cards = all;
    state.status = all.length ? 'ok' : 'empty';
    resetQueue(); render();
  }

  /* ================= 渲染：分组下拉 ================= */
  function renderGroupSelect() {
    const sel = els.selGroup;
    sel.innerHTML = '';

    if (state.status === 'loading' && !state.entries.length) {
      sel.add(new Option('正在读取', '')); sel.disabled = true; return;
    }
    if (state.status === 'empty') {
      sel.add(new Option('无内容', '')); sel.disabled = true; return;
    }

    sel.disabled = false;
    sel.add(new Option(`全部（${state.entries.length}）`, '__all__'));

    const keys = Object.keys(state.groups).sort(NATURAL_CMP);
    for (const k of keys) {
      const n = state.groups[k].length;
      const label = state.showDeck ? k.replace('|', ' · ') : k;
      sel.add(new Option(`${label}（${n}）`, 'G:' + k));
    }

    sel.value = state.groupKey ? 'G:' + state.groupKey : '__all__';
  }

  /* ================= 渲染：文件下拉 ================= */
  function renderFileSelect() {
    const sel = els.selFile;
    sel.innerHTML = '';

    // 未选分组 → 置灰
    if (state.groupKey === null) {
      sel.add(new Option('全部', ''));
      sel.disabled = true;
      return;
    }

    const list = state.groups[state.groupKey] || [];
    if (!list.length) {
      sel.add(new Option('—', ''));
      sel.disabled = true;
      return;
    }

    sel.disabled = false;
    sel.add(new Option(`全部（${list.length}）`, '__all__'));
    for (const e of list) {
      sel.add(new Option(String(e.index), 'F:' + e.raw));
    }
    sel.value = state.fileRaw ? 'F:' + state.fileRaw : '__all__';
  }

  /* ================= 渲染：卡片 ================= */
  function emptyMsg() {
    if (state.status === 'loading') return '正在读取';
    if (state.status === 'empty')   return '没有内容';
    if (state.query.trim() && state.cards.length > 0 && state.queue.length === 0)
      return '没有匹配的卡片';
    return '暂无数据';
  }

  function updateMeta() {
    if (state.status === 'loading' && !state.cards.length) return;
    const total = state.queue.length;
    const cur   = total ? state.pos + 1 : 0;
    els.metaCount.textContent = `共 ${total} 张`;
    els.metaPos.textContent   = total ? `${cur} / ${total}` : '';
  }

  function render() {
    if (state.status === 'loading' && !state.cards.length) {
      els.metaPos.textContent = '';
      els.faceText.classList.add('muted');
      els.faceText.textContent = '正在读取…';
      els.backText.textContent = '';
      els.answerBox.classList.add('hidden');
      els.btnReveal.classList.add('hidden');
      els.btnPrev.classList.add('hidden');
      els.btnNext.classList.add('hidden');
      return;
    }

    if (state.queue.length === 0) {
      els.faceText.classList.add('muted');
      els.faceText.textContent = emptyMsg();
      els.backText.textContent = '';
      els.answerBox.classList.add('hidden');
      els.btnReveal.classList.add('hidden');
      els.btnPrev.classList.add('hidden');
      els.btnNext.classList.add('hidden');
      updateMeta();
      return;
    }

    const card = state.queue[state.pos];
    const frontIsKey = state.face === 'key';

    els.faceText.classList.remove('muted');
    els.faceText.textContent = frontIsKey ? card.key : card.value;
    els.backText.textContent = frontIsKey ? card.value : card.key;
    els.cardBox.classList.toggle('memory', state.mode === 'memory');

    if (state.mode === 'memory') {
      els.answerBox.classList.remove('hidden');
      els.btnReveal.classList.add('hidden');
      els.btnPrev.classList.remove('hidden');
      els.btnNext.classList.remove('hidden');
      els.btnNext.textContent = '下一个';
    } else {
      els.answerBox.classList.toggle('hidden', !state.revealed);
      els.btnReveal.classList.remove('hidden');
      els.btnReveal.disabled = state.revealed;
      els.btnReveal.textContent = state.revealed
        ? '已显示' : (frontIsKey ? '显示值' : '显示键');
      els.btnPrev.classList.remove('hidden');
      els.btnNext.classList.remove('hidden');
      els.btnNext.textContent = '下一个';
    }
    updateMeta();
  }

  /* ================= 队列 ================= */
  function resetQueue() {
    const q = state.query.trim().toLowerCase();
    const list = q
      ? state.cards.filter(c =>
          c.key.toLowerCase().includes(q) || c.value.toLowerCase().includes(q))
      : state.cards.slice();
    state.queue = state.mode === 'recite' ? shuffle(list) : list;
    state.pos = 0; state.revealed = false;
  }

  function goPrev() {
    if (!state.queue.length) return;
    state.pos = (state.pos - 1 + state.queue.length) % state.queue.length;
    state.revealed = false; render();
  }
  function goNext() {
    if (!state.queue.length) return;
    state.pos = (state.pos + 1) % state.queue.length;
    state.revealed = false; render();
  }

  /* ================= 启动 ================= */
  async function loadAll() {
    state.status = 'loading';
    state.entries = []; state.groups = {}; state.showDeck = false;
    state.cards = []; state.queue = [];
    state.pos = 0; state.revealed = false;
    state.groupKey = null; state.fileRaw = null;

    renderGroupSelect(); renderFileSelect(); render();

    let data;
    try {
      data = await loadIndex();
    } catch (e) {
      console.error('读取 index.txt 失败：', e);
      state.status = 'empty';
      els.metaCount.textContent = '无法读取 index.txt';
      renderGroupSelect(); renderFileSelect(); render();
      return;
    }

    state.entries  = data.entries;
    state.groups   = data.groups;
    state.showDeck = data.showDeck;

    if (!state.entries.length) {
      state.status = 'empty';
      els.metaCount.textContent = 'index.txt 里没有找到合法词库';
      renderGroupSelect(); renderFileSelect(); render();
      return;
    }

    // 默认：全部分组
    state.groupKey = null;
    state.fileRaw  = null;
    renderGroupSelect();
    renderFileSelect();
    await loadCurrent();
  }

  /* ================= 事件 ================= */
  els.btnPrev.addEventListener('click', goPrev);
  els.btnNext.addEventListener('click', goNext);
  els.btnReveal.addEventListener('click', () => {
    if (state.mode !== 'recite' || state.revealed) return;
    state.revealed = true; render();
  });
  els.cardBox.addEventListener('click', () => {
    if (state.mode === 'recite' && !state.revealed && state.queue.length) {
      state.revealed = true; render();
    }
  });

  els.selGroup.addEventListener('change', async () => {
    const v = els.selGroup.value;
    if (!v) return;

    if (v === '__all__') {
      state.groupKey = null;
      state.fileRaw  = null;
    } else if (v.startsWith('G:')) {
      state.groupKey = v.slice(2);
      state.fileRaw  = null;    // 切换分组时重置文件选择
    }

    renderFileSelect();          // 刷新二级下拉
    await loadCurrent();
  });

  els.selFile.addEventListener('change', async () => {
    const v = els.selFile.value;
    if (v === '__all__') {
      state.fileRaw = null;
    } else if (v.startsWith('F:')) {
      state.fileRaw = v.slice(2);
    }
    await loadCurrent();
  });

  els.selFace.addEventListener('change', () => {
    state.face = els.selFace.value; state.revealed = false; render();
  });
  els.selMode.addEventListener('change', () => {
    state.mode = els.selMode.value; resetQueue(); render();
  });
  els.search.addEventListener('input', e => {
    state.query = e.target.value;
    els.clear.classList.toggle('hidden', !state.query);
    resetQueue(); render();
  });
  els.clear.addEventListener('click', () => {
    els.search.value = ''; state.query = '';
    els.clear.classList.add('hidden');
    resetQueue(); render(); els.search.focus();
  });

  /* ================= 沉浸 ================= */
  async function enterImmersive() {
    state.immersive = true;
    els.app.classList.add('immersive');
    els.exitImm.classList.remove('hidden');
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen)
        await document.documentElement.requestFullscreen();
    } catch (_) {}
  }
  function exitImmersive() {
    if (!state.immersive) return;
    state.immersive = false;
    els.app.classList.remove('immersive');
    els.exitImm.classList.add('hidden');
    if (document.fullscreenElement && document.exitFullscreen)
      document.exitFullscreen().catch(() => {});
  }
  els.btnImmersive.addEventListener('click', () => {
    state.immersive ? exitImmersive() : enterImmersive();
  });
  els.exitImm.addEventListener('click', exitImmersive);
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && state.immersive) exitImmersive();
  });

  /* ================= 快捷键 ================= */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    switch (e.key) {
      case ' ':
        e.preventDefault();
        if (state.mode === 'recite' && !state.revealed && state.queue.length) {
          state.revealed = true; render();
        }
        break;
      case 'Enter':
      case 'ArrowRight': e.preventDefault(); goNext(); break;
      case 'ArrowLeft':  e.preventDefault(); goPrev(); break;
    }
  });

  loadAll();
})();
</script>
</body>
</html>
