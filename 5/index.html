<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
            background: #f5f0eb;
            color: #2d2d2d;
            padding: 14px 14px 30px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }

        /* ===== 顶部切换 ===== */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0d6ce;
            flex-wrap: wrap;
        }
        .tabs button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #8a7a6a;
            transition: all 0.2s;
            flex: 0 0 auto;
            touch-action: manipulation;
        }
        .tabs button:hover {
            color: #4a3520;
        }
        .tabs button.active {
            color: #4a3520;
            border-bottom-color: #d48c5c;
        }

        /* ===== 面板 ===== */
        .panel {
            display: none;
            animation: fadePanel 0.2s ease;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadePanel {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 搜索框（仅菜谱） ===== */
        .search-box {
            margin-bottom: 18px;
            display: none;
        }
        .search-box.visible {
            display: block;
        }
        .search-box input {
            width: 100%;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #e0d6ce;
            border-radius: 40px;
            background: white;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: #d48c5c;
            box-shadow: 0 0 0 3px rgba(212, 140, 92, 0.15);
        }

        /* ===== 菜谱卡片 ===== */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: white;
            border-radius: 18px;
            padding: 20px 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(224, 214, 206, 0.4);
            cursor: pointer;
            position: relative;
            border-left: 5px solid #d48c5c;
            transition: 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }
        @media (hover: hover) {
            .card:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
                border-color: #d48c5c;
            }
        }
        .card .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 30px;
            background: #f0ebe4;
            color: #6a5a4a;
            display: inline-block;
            margin-bottom: 8px;
        }
        .card .title {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .card .date {
            font-size: 0.8rem;
            color: #b0a090;
            margin: 4px 0 8px;
        }
        .card .summary {
            color: #5a4a3a;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ===== 随笔列表 ===== */
        .entry-list {
            margin-top: 4px;
        }
        .entry {
            padding: 14px 4px;
            border-bottom: 1px solid #e8e0d8;
            cursor: pointer;
            transition: background 0.15s;
        }
        .entry:active {
            background: rgba(0, 0, 0, 0.02);
        }
        @media (hover: hover) {
            .entry:hover {
                background: rgba(0, 0, 0, 0.01);
            }
        }
        .entry .entry-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .entry .entry-date {
            font-size: 0.85rem;
            color: #b0a090;
        }

        /* ===== 价格参考 ===== */
        .price-search {
            margin-bottom: 18px;
        }
        .price-search input {
            width: 100%;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #e0d6ce;
            border-radius: 40px;
            background: white;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .price-search input:focus {
            border-color: #d48c5c;
            box-shadow: 0 0 0 3px rgba(212, 140, 92, 0.15);
        }
        .price-table-wrap {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(224, 214, 206, 0.4);
        }
        .price-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .price-table th {
            text-align: left;
            padding: 14px 16px;
            background: #f8f4ef;
            color: #4a3520;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #e0d6ce;
        }
        .price-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0ebe4;
            color: #3d3d3d;
        }
        .price-table tr:last-child td {
            border-bottom: none;
        }
        .price-table .price {
            font-weight: 600;
            color: #d48c5c;
        }
        .price-table .range {
            font-size: 0.9rem;
            color: #5a4a3a;
        }
        .price-table .empty-row td {
            text-align: center;
            color: #b0a090;
            padding: 30px 16px;
        }
        .price-table .category-tag {
            font-size: 0.8rem;
            background: #f0ebe4;
            padding: 2px 12px;
            border-radius: 20px;
            display: inline-block;
            color: #5a4a3a;
        }
        @media (max-width: 600px) {
            .price-table th,
            .price-table td {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
            .price-table .category-tag {
                font-size: 0.7rem;
                padding: 1px 10px;
            }
        }

        /* ===== 加载/空状态 ===== */
        .loading {
            text-align: center;
            padding: 30px 10px;
            color: #b0a090;
            font-size: 0.95rem;
        }
        .loading .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0d6ce;
            border-top-color: #d48c5c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .empty {
            text-align: center;
            padding: 30px 10px;
            color: #b0a090;
            font-size: 0.95rem;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 24px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            position: relative;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.25s;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .modal .close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #b0a090;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal .close-btn:hover {
            color: #c0392b;
        }

        /* ===== 菜谱详情 ===== */
        .recipe-detail .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 2px;
            line-height: 1.2;
            text-align: center;
        }
        .recipe-detail .detail-date {
            color: #b0a090;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: center;
        }
        .recipe-detail .ingredients-block {
            background: #f8f4ef;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 24px;
            border-left: 4px solid #d48c5c;
        }
        .recipe-detail .ingredients-block h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #4a3520;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .recipe-detail .ingredient-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .recipe-detail .ingredient-list li {
            padding: 4px 0;
            font-size: 0.95rem;
            color: #3d3d3d;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.04);
        }
        .recipe-detail .ingredient-list li:last-child {
            border-bottom: none;
        }
        .recipe-detail .ingredient-list .ing-name {
            color: #3d3d3d;
        }
        .recipe-detail .ingredient-list .ing-amount {
            color: #d48c5c;
            font-weight: 600;
        }
        .recipe-detail .ingredient-list .ing-sep {
            color: #b0a090;
            margin: 0 4px;
        }
        .recipe-detail .method-block h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a3520;
            margin: 20px 0 10px;
            border-bottom: 2px solid #f0ebe4;
            padding-bottom: 4px;
        }
        .recipe-detail .method-block ol {
            padding-left: 24px;
            margin: 6px 0 16px;
        }
        .recipe-detail .method-block li {
            margin-bottom: 8px;
            line-height: 1.7;
        }
        .recipe-detail .method-block .tips {
            background: #f0ebe4;
            border-radius: 12px;
            padding: 14px 18px;
            margin: 16px 0 0;
            border-left: 4px solid #b0a090;
        }
        .recipe-detail .method-block .tips strong {
            color: #4a3520;
        }

        /* ===== 随笔详情 ===== */
        .note-detail .detail-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 4px;
            line-height: 1.2;
            text-align: center;
        }
        .note-detail .detail-date {
            color: #b0a090;
            margin-bottom: 24px;
            font-size: 0.95rem;
            border-bottom: 1px solid #f0ebe4;
            padding-bottom: 12px;
            text-align: center;
        }
        .note-detail .detail-body {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #2d2d2d;
        }
        .note-detail .detail-body p {
            text-indent: 2em;
            margin-bottom: 16px;
        }
        .note-detail .detail-body blockquote {
            border-left: 4px solid #d48c5c;
            padding: 8px 18px;
            margin: 16px 0;
            background: #f8f4ef;
            border-radius: 0 10px 10px 0;
            color: #4a3a2a;
        }
        .note-detail .detail-body ul,
        .note-detail .detail-body ol {
            padding-left: 28px;
            margin: 10px 0 16px;
        }
        .note-detail .detail-body li {
            margin-bottom: 6px;
        }

        @media (max-width: 460px) {
            .modal {
                padding: 20px 16px;
            }
            .recipe-detail .detail-title,
            .note-detail .detail-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部切换 -->
        <div class="tabs" id="tabs">
            <button class="active" data-panel="recipe">菜谱</button>
            <button data-panel="note">随笔</button>
            <button data-panel="price">价格参考</button>
        </div>

        <!-- ===== 面板：菜谱 ===== -->
        <div class="panel active" id="panel-recipe">
            <div class="search-box visible" id="searchBox">
                <input type="text" id="recipeSearch" placeholder="搜索食材..." />
            </div>
            <div class="grid" id="recipeGrid"></div>
        </div>

        <!-- ===== 面板：随笔 ===== -->
        <div class="panel" id="panel-note">
            <div class="entry-list" id="noteList"></div>
        </div>

        <!-- ===== 面板：价格参考 ===== -->
        <div class="panel" id="panel-price">
            <div class="price-search">
                <input type="text" id="priceSearch" placeholder="搜索食材或类别..." />
            </div>
            <div class="price-table-wrap">
                <table class="price-table">
                    <thead>
                        <tr>
                            <th>食材</th>
                            <th>类别</th>
                            <th>均价 (元/公斤)</th>
                            <th>价格区间 (元/公斤)</th>
                        </tr>
                    </thead>
                    <tbody id="priceBody"></tbody>
                </table>
            </div>
        </div>

        <!-- ===== 模态框 ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal" id="modalContent">
                <button class="close-btn" id="closeBtn">&times;</button>
                <div id="detailContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  配置（请确认你的仓库信息）
        // ================================================================
        const GITHUB_CONFIG = {
            owner: 'eternallight-debug',
            repo: 'life_blog',
            branch: 'main',
            path: '5',
        };

        // ================================================================
        //  使用 raw.githubusercontent.com 获取文件（更稳定，绕过 API 限制）
        // ================================================================
        const RAW_BASE =
            `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${GITHUB_CONFIG.path}`;

        // ================================================================
        //  状态
        // ================================================================
        let allRecipes = [];
        let allNotes = [];
        let priceData = [];
        let currentView = 'recipe';
        let searchKeyword = '';

        // ================================================================
        //  DOM 引用
        // ================================================================
        const recipeGrid = document.getElementById('recipeGrid');
        const noteList = document.getElementById('noteList');
        const priceBody = document.getElementById('priceBody');
        const searchBox = document.getElementById('searchBox');
        const searchInput = document.getElementById('recipeSearch');
        const priceSearch = document.getElementById('priceSearch');
        const tabs = document.querySelectorAll('#tabs button');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const detailContainer = document.getElementById('detailContainer');

        // ================================================================
        //  工具函数
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, m => map[m] || m);
        }

        function safeDate(str) {
            if (!str) return '';
            const d = new Date(str);
            if (isNaN(d)) return str;
            return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function parseFrontMatter(content) {
            const trimmed = content.trimStart();
            if (!trimmed.startsWith('---')) {
                return { meta: {}, body: trimmed };
            }
            const lines = trimmed.split('\n');
            let end = -1;
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '---') { end = i; break; }
            }
            if (end === -1) return { meta: {}, body: trimmed };
            const metaLines = lines.slice(1, end);
            const body = lines.slice(end + 1).join('\n').trim();
            const meta = {};
            for (const line of metaLines) {
                const sep = line.indexOf(':');
                if (sep === -1) continue;
                let key = line.slice(0, sep).trim();
                let val = line.slice(sep + 1).trim();
                if (key === 'tags' && val.includes(',')) {
                    val = val.split(',').map(s => s.trim()).filter(Boolean);
                }
                meta[key] = val;
            }
            return { meta, body };
        }

        // ----- 解析菜谱内容（提取食材、做法、要点） -----
        function parseRecipeContent(body) {
            const lines = body.split('\n');
            let section = null;
            let ingredients = [];
            let steps = [];
            let tips = '';
            let currentText = '';

            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('## ')) {
                    if (section === 'ingredients' && currentText.trim()) {
                        const items = currentText.split('\n').map(s => s.trim()).filter(s => s);
                        for (const item of items) {
                            if (item.includes('/')) {
                                const parts = item.split('/').map(s => s.trim());
                                ingredients.push({ name: parts[0], amount: parts.slice(1).join('/') });
                            } else {
                                ingredients.push({ name: item, amount: '' });
                            }
                        }
                    } else if (section === 'steps' && currentText.trim()) {
                        steps = currentText.split('\n').map(s => s.trim()).filter(s => s);
                    } else if (section === 'tips' && currentText.trim()) {
                        tips = currentText.trim();
                    }
                    const title = trimmed.replace(/^## /, '').trim();
                    if (title === '食材') {
                        section = 'ingredients';
                        currentText = '';
                    } else if (title === '做法') {
                        section = 'steps';
                        currentText = '';
                    } else if (title === '要点') {
                        section = 'tips';
                        currentText = '';
                    } else {
                        section = null;
                        currentText = '';
                    }
                } else {
                    if (section) currentText += line + '\n';
                }
            }
            if (section === 'ingredients' && currentText.trim()) {
                const items = currentText.split('\n').map(s => s.trim()).filter(s => s);
                for (const item of items) {
                    if (item.includes('/')) {
                        const parts = item.split('/').map(s => s.trim());
                        ingredients.push({ name: parts[0], amount: parts.slice(1).join('/') });
                    } else {
                        ingredients.push({ name: item, amount: '' });
                    }
                }
            } else if (section === 'steps' && currentText.trim()) {
                steps = currentText.split('\n').map(s => s.trim()).filter(s => s);
            } else if (section === 'tips' && currentText.trim()) {
                tips = currentText.trim();
            }

            return { ingredients, steps, tips };
        }

        // ================================================================
        //  流式加载
        // ================================================================

        // ----- 获取目录文件列表（使用 API） -----
        async function fetchDir(folder) {
            const url =
                `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}/${folder}?ref=${GITHUB_CONFIG.branch}`;
            const resp = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store',
            });
            if (!resp.ok) {
                if (resp.status === 404) return [];
                throw new Error(`请求失败 (${resp.status})`);
            }
            const data = await resp.json();
            if (!Array.isArray(data)) return [];
            return data.filter(item => item.type === 'file' && item.name.endsWith('.txt'));
        }

        // ----- 通过 raw 获取文件内容（绕过 API 限制） -----
        async function fetchRawFile(filePath) {
            const url = `${RAW_BASE}/${filePath}`;
            const resp = await fetch(url, { cache: 'no-store' });
            if (!resp.ok) throw new Error(`文件读取失败 (${resp.status})`);
            return await resp.text();
        }

        // ----- 流式加载菜谱 -----
        async function loadRecipesStream() {
            try {
                recipeGrid.innerHTML = `<div class="loading"><div class="spinner"></div>加载菜谱...</div>`;
                const files = await fetchDir('recipes');
                if (files.length === 0) {
                    recipeGrid.innerHTML = `<div class="empty">暂无菜谱</div>`;
                    return;
                }

                recipeGrid.innerHTML = '';
                const loadedItems = [];

                for (const file of files) {
                    try {
                        const content = await fetchRawFile(`recipes/${file.name}`);
                        const { meta, body } = parseFrontMatter(content);
                        const parsed = parseRecipeContent(body);

                        const item = {
                            id: file.name.replace(/\.txt$/, ''),
                            title: meta.title || file.name.replace(/\.txt$/, ''),
                            summary: meta.summary || meta.description || '',
                            date: meta.date || '',
                            ingredients: parsed.ingredients || [],
                            steps: parsed.steps || [],
                            tips: parsed.tips || '',
                            content: body,
                        };
                        loadedItems.push(item);
                        allRecipes = loadedItems;
                        renderRecipes();
                    } catch (e) {
                        console.warn('跳过菜谱:', file.name, e);
                    }
                }

                if (loadedItems.length === 0) {
                    recipeGrid.innerHTML = `<div class="empty">暂无菜谱</div>`;
                }
            } catch (err) {
                console.error(err);
                recipeGrid.innerHTML = `<div class="empty">加载失败</div>`;
            }
        }

        // ----- 流式加载随笔 -----
        async function loadNotesStream() {
            try {
                noteList.innerHTML = `<div class="loading"><div class="spinner"></div>加载随笔...</div>`;
                const files = await fetchDir('notes');
                if (files.length === 0) {
                    noteList.innerHTML = `<div class="empty">暂无随笔</div>`;
                    return;
                }

                noteList.innerHTML = '';
                const loadedItems = [];

                for (const file of files) {
                    try {
                        const content = await fetchRawFile(`notes/${file.name}`);
                        const { meta, body } = parseFrontMatter(content);

                        const item = {
                            id: file.name.replace(/\.txt$/, ''),
                            title: meta.title || file.name.replace(/\.txt$/, ''),
                            summary: meta.summary || meta.description || '',
                            date: meta.date || '',
                            content: body,
                        };
                        loadedItems.push(item);
                        allNotes = loadedItems;
                        renderNotes();
                    } catch (e) {
                        console.warn('跳过随笔:', file.name, e);
                    }
                }

                if (loadedItems.length === 0) {
                    noteList.innerHTML = `<div class="empty">暂无随笔</div>`;
                }
            } catch (err) {
                console.error(err);
                noteList.innerHTML = `<div class="empty">加载失败</div>`;
            }
        }

        // ================================================================
        //  渲染函数
        // ================================================================

        function renderRecipes() {
            let items = allRecipes;
            if (searchKeyword.trim()) {
                const kw = searchKeyword.trim().toLowerCase();
                items = items.filter(item =>
                    item.ingredients && item.ingredients.some(ing => ing.name.includes(kw))
                );
            }

            if (!items || items.length === 0) {
                if (allRecipes.length === 0) return;
                recipeGrid.innerHTML = `<div class="empty">没有匹配的菜谱</div>`;
                return;
            }

            const sorted = [...items].sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(b.date) - new Date(a.date);
            });

            let html = '';
            for (const item of sorted) {
                const dateStr = item.date ? safeDate(item.date) : '';
                const summary = item.summary || '';
                html += `
                        <div class="card" data-id="${item.id}">
                            <span class="badge">菜谱</span>
                            <div class="title">${escapeHtml(item.title)}</div>
                            ${dateStr ? `<div class="date">${dateStr}</div>` : ''}
                            ${summary ? `<div class="summary">${escapeHtml(summary)}</div>` : ''}
                        </div>
                    `;
            }
            recipeGrid.innerHTML = html;

            recipeGrid.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const item = allRecipes.find(i => i.id === id);
                    if (item) openRecipeModal(item);
                });
            });
        }

        function renderNotes() {
            const items = allNotes;
            if (!items || items.length === 0) {
                if (allNotes.length === 0) return;
                noteList.innerHTML = `<div class="empty">暂无随笔</div>`;
                return;
            }

            const sorted = [...items].sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(b.date) - new Date(a.date);
            });

            let html = '';
            for (const item of sorted) {
                const dateStr = item.date ? safeDate(item.date) : '';
                html += `
                        <div class="entry" data-id="${item.id}">
                            <div class="entry-title">${escapeHtml(item.title)}</div>
                            ${dateStr ? `<div class="entry-date">${dateStr}</div>` : ''}
                        </div>
                    `;
            }
            noteList.innerHTML = html;

            noteList.querySelectorAll('.entry').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const item = allNotes.find(i => i.id === id);
                    if (item) openNoteModal(item);
                });
            });
        }

        // ================================================================
        //  模态框
        // ================================================================

        function openRecipeModal(item) {
            const ingredientItems = (item.ingredients || []).map(ing =>
                `<li>
                        <span class="ing-name">${escapeHtml(ing.name)}</span>
                        ${ing.amount ? `<span class="ing-sep">/</span><span class="ing-amount">${escapeHtml(ing.amount)}</span>` : ''}
                    </li>`
            ).join('');

            const stepsHtml = (item.steps || []).map(s => `<li>${escapeHtml(s)}</li>`).join('');

            const html = `
                    <div class="recipe-detail">
                        <div class="detail-title">${escapeHtml(item.title)}</div>
                        <div class="detail-date">${item.date ? safeDate(item.date) : ''}</div>
                        <div class="ingredients-block">
                            <h3>食材</h3>
                            <ul class="ingredient-list">
                                ${ingredientItems || '<li style="color:#b0a090;">无食材信息</li>'}
                            </ul>
                        </div>
                        <div class="method-block">
                            <h3>做法</h3>
                            <ol>
                                ${stepsHtml || '<li style="color:#b0a090;">无做法信息</li>'}
                            </ol>
                            ${item.tips ? `<div class="tips"><strong>要点：</strong>${escapeHtml(item.tips)}</div>` : ''}
                        </div>
                    </div>
                `;
            detailContainer.innerHTML = html;
            modalOverlay.classList.add('active');
        }

        function openNoteModal(item) {
            const html = `
                    <div class="note-detail">
                        <div class="detail-title">${escapeHtml(item.title)}</div>
                        <div class="detail-date">${item.date ? safeDate(item.date) : ''}</div>
                        <div class="detail-body">${renderMarkdown(item.content)}</div>
                    </div>
                `;
            detailContainer.innerHTML = html;
            modalOverlay.classList.add('active');
        }

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text;
            html = html.replace(/<script[\s\S]*?<\/script>/gi, '');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;" />');
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
            html = html.replace(/^[\*\-] (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br />');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<li>([\s\S]*?)<\/li>/g, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul>\s*<ul>/g, '');
            return html;
        }

        // ================================================================
        //  价格加载（使用 raw 直接读取，稳定可靠）
        // ================================================================
        async function loadPrices() {
            try {
                const url = `${RAW_BASE}/prices.json`;
                console.log('价格请求 URL:', url);

                const resp = await fetch(url, { cache: 'no-store' });
                if (!resp.ok) {
                    let msg = `HTTP ${resp.status}`;
                    if (resp.status === 404) {
                        msg = `prices.json 文件未找到，请确认文件在 /${GITHUB_CONFIG.path}/ 目录下`;
                    }
                    priceBody.innerHTML =
                    `<tr class="empty-row"><td colspan="4">⚠️ 价格加载失败：${escapeHtml(msg)}</td></tr>`;
                    return;
                }

                const data = await resp.json();
                if (!data.list || !Array.isArray(data.list)) {
                    priceBody.innerHTML = `<tr class="empty-row"><td colspan="4">⚠️ 数据格式错误，缺少 "list" 数组</td></tr>`;
                    return;
                }
                priceData = data.list;
                renderPriceTable(priceData);
                console.log('✅ 价格数据加载成功，共', priceData.length, '条');
            } catch (err) {
                console.error('价格加载错误:', err);
                priceBody.innerHTML =
                    `<tr class="empty-row"><td colspan="4">❌ 网络错误：${escapeHtml(err.message)}</td></tr>`;
            }
        }

        function renderPriceTable(data) {
            if (!data || data.length === 0) {
                priceBody.innerHTML = `<tr class="empty-row"><td colspan="4">暂无价格数据</td></tr>`;
                return;
            }
            let html = '';
            for (const item of data) {
                const range = `${item.low_price} ~ ${item.high_price}`;
                html += `
                        <tr>
                            <td><strong>${escapeHtml(item.name)}</strong></td>
                            <td><span class="category-tag">${escapeHtml(item.category)}</span></td>
                            <td class="price">${escapeHtml(item.avg_price)}</td>
                            <td class="range">${escapeHtml(range)}</td>
                        </tr>
                    `;
            }
            priceBody.innerHTML = html;
        }

        function filterPrice(keyword) {
            const kw = keyword.trim().toLowerCase();
            if (!kw) {
                renderPriceTable(priceData);
                return;
            }
            const filtered = priceData.filter(item =>
                item.name.includes(kw) || item.category.includes(kw)
            );
            renderPriceTable(filtered);
        }

        // ================================================================
        //  切换面板
        // ================================================================
        function switchPanel(name) {
            currentView = name;
            tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.panel === name));
            document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
            document.getElementById(`panel-${name}`).classList.add('active');
            searchBox.classList.toggle('visible', name === 'recipe');
            if (name === 'price') {
                renderPriceTable(priceData);
            }
        }

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const name = btn.dataset.panel;
                if (name !== currentView) switchPanel(name);
            });
        });

        // ================================================================
        //  搜索事件
        // ================================================================
        searchInput.addEventListener('input', (e) => {
            searchKeyword = e.target.value;
            renderRecipes();
        });

        priceSearch.addEventListener('input', (e) => {
            filterPrice(e.target.value);
        });

        // ================================================================
        //  模态框关闭
        // ================================================================
        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // ================================================================
        //  启动
        // ================================================================
        document.getElementById('panel-recipe').classList.add('active');
        searchBox.classList.add('visible');

        loadRecipesStream();
        loadNotesStream();
        loadPrices();

        console.log('✅ 已启动 — 价格使用 raw 直读，绕过 API 限制');
        console.log('📁 配置文件路径:', RAW_BASE);
    </script>
</body>
</html>
