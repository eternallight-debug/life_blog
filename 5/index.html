<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>笔记</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
            background: #f5f0eb;
            color: #2d2d2d;
            padding: 14px 14px 30px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 880px; margin: 0 auto; }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0d6ce;
            background: transparent;
        }
        .tabs button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: #8a7a6a;
            transition: all 0.2s;
            flex: 0 0 auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .tabs button:hover { color: #4a3520; }
        .tabs button.active { color: #4a3520; border-bottom-color: #d48c5c; }

        .search-box {
            margin-bottom: 18px;
            display: none;
        }
        .search-box.visible { display: block; }
        .search-box input {
            width: 100%;
            padding: 12px 18px;
            font-size: 1rem;
            border: 2px solid #e0d6ce;
            border-radius: 40px;
            background: white;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            appearance: none;
        }
        .search-box input:focus {
            border-color: #d48c5c;
            box-shadow: 0 0 0 3px rgba(212, 140, 92, 0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }
        @media (min-width: 640px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* 菜谱卡片 */
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 22px 22px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(224, 214, 206, 0.4);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .card:active { transform: scale(0.98); }
        @media (hover: hover) {
            .card:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
                border-color: #d48c5c;
            }
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: #d48c5c;
            border-radius: 18px 0 0 18px;
            opacity: 0.7;
        }

        .card .type-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 30px;
            background: #f0ebe4;
            color: #6a5a4a;
            align-self: flex-start;
            margin-bottom: 10px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .card .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .card .date {
            font-size: 0.8rem;
            color: #b0a090;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }
        .card .summary {
            font-size: 0.95rem;
            color: #5a4a3a;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            margin-top: 2px;
        }

        /* 随笔列表项 */
        .entry {
            padding: 14px 4px;
            border-bottom: 1px solid #e8e0d8;
            cursor: pointer;
            transition: background 0.15s;
            -webkit-tap-highlight-color: transparent;
        }
        .entry:active { background: rgba(0,0,0,0.02); }
        @media (hover: hover) {
            .entry:hover { background: rgba(0,0,0,0.01); }
        }
        .entry .entry-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d2d2d;
            line-height: 1.3;
        }
        .entry .entry-date {
            font-size: 0.85rem;
            color: #b0a090;
            margin-top: 2px;
            letter-spacing: 0.2px;
        }
        @media (max-width: 460px) {
            .entry { padding: 12px 2px; }
            .entry .entry-title { font-size: 1.1rem; }
        }

        .loading, .empty {
            text-align: center;
            padding: 40px 10px;
            color: #b0a090;
            font-size: 0.95rem;
        }
        .empty .error-detail {
            font-size: 0.85rem;
            color: #c0392b;
            margin-top: 6px;
            word-break: break-word;
        }
        .loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e0d6ce;
            border-top-color: #d48c5c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeOverlay 0.25s;
        }
        @keyframes fadeOverlay {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 24px;
            max-width: 680px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 26px 32px;
            position: relative;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .modal .close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #b0a090;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal .close-btn:hover,
        .modal .close-btn:active { color: #c0392b; }
        .modal .modal-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .modal .modal-date {
            color: #b0a090;
            margin-bottom: 18px;
            font-size: 0.9rem;
        }
        .modal .modal-body {
            font-size: 1rem;
            color: #3d3d3d;
            line-height: 1.8;
        }
        .modal .modal-body p {
            text-indent: 2em;
            margin-bottom: 12px;
        }
        .modal .modal-body h1,
        .modal .modal-body h2,
        .modal .modal-body h3,
        .modal .modal-body ul,
        .modal .modal-body ol,
        .modal .modal-body blockquote,
        .modal .modal-body pre { text-indent: 0; }
        .modal .modal-body h2 {
            margin-top: 24px;
            margin-bottom: 10px;
            font-size: 1.3rem;
            color: #4a3520;
            border-bottom: 1px solid #f0ebe4;
            padding-bottom: 4px;
        }
        .modal .modal-body h3 {
            margin-top: 18px;
            margin-bottom: 6px;
            font-size: 1.1rem;
            color: #4a3520;
        }
        .modal .modal-body ul, .modal .modal-body ol {
            padding-left: 28px;
            margin: 8px 0 16px;
        }
        .modal .modal-body li { margin-bottom: 6px; }
        .modal .modal-body blockquote {
            border-left: 4px solid #d48c5c;
            padding: 10px 18px;
            margin: 14px 0;
            background: #f8f4ef;
            border-radius: 0 10px 10px 0;
            color: #5a4a3a;
        }
        .modal .modal-body pre {
            background: #f4f0eb;
            padding: 14px 18px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .modal .modal-body code {
            background: #f0ebe4;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-thumb { background: #d48c5c; border-radius: 12px; }
        .modal::-webkit-scrollbar-track { background: #f5f0eb; border-radius: 12px; }

        @media (max-width: 460px) {
            body { padding: 10px 10px 20px; }
            .card { padding: 16px 16px 18px; border-radius: 14px; }
            .card .title { font-size: 1.1rem; }
            .card .summary { font-size: 0.9rem; -webkit-line-clamp: 2; }
            .tabs button { padding: 10px 14px; font-size: 0.95rem; }
            .search-box input { padding: 10px 14px; font-size: 0.95rem; }
            .modal { padding: 20px 18px 24px; border-radius: 18px; }
            .modal .modal-title { font-size: 1.5rem; }
            .entry .entry-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="active" data-view="recipe">菜谱</button>
            <button data-view="note">随笔</button>
        </div>

        <div class="search-box visible" id="searchBox">
            <input type="text" id="recipeSearch" placeholder="搜索食材..." />
        </div>

        <div id="recipeGrid" class="grid"></div>
        <div id="noteGrid" style="display: none;"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="close-btn" id="modalClose">&times;</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-date" id="modalDate"></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // ================================================================
        //  配置（请务必确认信息正确）
        // ================================================================
        const GITHUB_CONFIG = {
            owner: 'eternallight-debug',   // 你的 GitHub 用户名
            repo: 'life_blog',             // 仓库名
            branch: 'main',                // 分支名（通常为 main 或 master）
            path: '5',                     // index.html 所在目录
        };

        // ================================================================
        //  构造 API URL（明确指定分支，避免默认分支问题）
        // ================================================================
        const BASE_URL = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?ref=${GITHUB_CONFIG.branch}`;

        // ================================================================
        //  状态
        // ================================================================
        let allRecipes = [];
        let allNotes = [];
        let currentView = 'recipe';
        let searchKeyword = '';

        // ================================================================
        //  DOM 引用
        // ================================================================
        const recipeGrid = document.getElementById('recipeGrid');
        const noteGrid = document.getElementById('noteGrid');
        const searchBox = document.getElementById('searchBox');
        const searchInput = document.getElementById('recipeSearch');
        const tabs = document.querySelectorAll('.tabs button');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalTitle = document.getElementById('modalTitle');
        const modalDate = document.getElementById('modalDate');
        const modalBody = document.getElementById('modalBody');

        // ================================================================
        //  工具函数
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, m => map[m] || m);
        }

        function safeDate(str) {
            if (!str) return '';
            const d = new Date(str);
            if (isNaN(d)) return str;
            return d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function parseFrontMatter(content) {
            const trimmed = content.trimStart();
            if (!trimmed.startsWith('---')) {
                return { meta: {}, body: trimmed };
            }
            const lines = trimmed.split('\n');
            let end = -1;
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '---') { end = i; break; }
            }
            if (end === -1) return { meta: {}, body: trimmed };
            const metaLines = lines.slice(1, end);
            const body = lines.slice(end + 1).join('\n').trim();
            const meta = {};
            for (const line of metaLines) {
                const sep = line.indexOf(':');
                if (sep === -1) continue;
                let key = line.slice(0, sep).trim();
                let val = line.slice(sep + 1).trim();
                if (key === 'tags' && val.includes(',')) {
                    val = val.split(',').map(s => s.trim()).filter(Boolean);
                }
                meta[key] = val;
            }
            return { meta, body };
        }

        function parseRecipeIngredients(body) {
            const lines = body.split('\n');
            let inIngredients = false;
            const ingredients = [];
            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed.startsWith('## ')) {
                    if (trimmed === '## 食材') {
                        inIngredients = true;
                        continue;
                    } else {
                        inIngredients = false;
                    }
                }
                if (inIngredients && trimmed) {
                    ingredients.push(trimmed);
                }
            }
            return ingredients;
        }

        // ================================================================
        //  数据加载（增强错误输出）
        // ================================================================
        async function fetchDir(folder) {
            // 注意：BASE_URL 已经包含 ?ref=分支，但我们要附加文件夹名，所以需要处理
            // 因为 BASE_URL 是类似 .../contents/5?ref=main，我们追加 /recipes 会导致 ?ref 位置错误
            // 所以重新构造：不带 ?ref 的主路径，再带参数
            const baseWithoutRef = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
            const url = `${baseWithoutRef}/${folder}?ref=${GITHUB_CONFIG.branch}`;
            console.log('请求 URL:', url); // 输出到控制台，方便检查

            const resp = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store',
            });

            if (!resp.ok) {
                if (resp.status === 404) {
                    throw new Error(`文件夹 "/${GITHUB_CONFIG.path}/${folder}/" 不存在，请创建并放入 .txt 文件。`);
                }
                if (resp.status === 403) {
                    throw new Error(`API 访问受限（可能达到速率限制），请稍后重试，或检查仓库是否为公开。`);
                }
                throw new Error(`请求失败 (HTTP ${resp.status}): ${resp.statusText}`);
            }
            const data = await resp.json();
            if (!Array.isArray(data)) return [];
            return data.filter(item => item.type === 'file' && item.name.endsWith('.txt'));
        }

        async function fetchFileContent(fileUrl) {
            const resp = await fetch(fileUrl, { cache: 'no-store' });
            if (!resp.ok) throw new Error(`文件读取失败 (${resp.status})`);
            return await resp.text();
        }

        // ----- 加载菜谱 -----
        async function loadRecipes() {
            try {
                recipeGrid.innerHTML = `<div class="loading"><div class="spinner"></div>加载菜谱...</div>`;
                const files = await fetchDir('recipes');
                if (files.length === 0) {
                    recipeGrid.innerHTML = `<div class="empty">暂无菜谱</div>`;
                    allRecipes = [];
                    renderRecipes();
                    return;
                }

                const promises = files.map(async file => {
                    try {
                        const content = await fetchFileContent(file.download_url);
                        const { meta, body } = parseFrontMatter(content);
                        const ingredients = parseRecipeIngredients(body);
                        return {
                            id: file.name.replace(/\.txt$/, ''),
                            title: meta.title || file.name.replace(/\.txt$/, ''),
                            summary: meta.summary || meta.description || '',
                            date: meta.date || '',
                            tags: meta.tags || [],
                            content: body,
                            ingredients: ingredients,
                        };
                    } catch (e) {
                        console.warn('跳过菜谱:', file.name, e);
                        return null;
                    }
                });
                const results = await Promise.all(promises);
                allRecipes = results.filter(r => r !== null);
                renderRecipes();
            } catch (err) {
                console.error('加载菜谱失败:', err);
                // 判断错误类型
                let detail = escapeHtml(err.message);
                if (err.message.includes('Failed to fetch')) {
                    detail += '<br/><span style="font-size:0.8rem;color:#7a6a5a;">可能原因：网络中断、DNS解析失败，或 API 被拦截。请检查网络连接，或尝试使用 VPN/代理。</span>';
                }
                recipeGrid.innerHTML = `
                    <div class="empty">
                        加载失败
                        <div class="error-detail">${detail}</div>
                    </div>
                `;
            }
        }

        // ----- 加载随笔 -----
        async function loadNotes() {
            try {
                noteGrid.innerHTML = `<div class="loading"><div class="spinner"></div>加载随笔...</div>`;
                const files = await fetchDir('notes');
                if (files.length === 0) {
                    noteGrid.innerHTML = `<div class="empty">暂无随笔</div>`;
                    allNotes = [];
                    renderNotes();
                    return;
                }

                const promises = files.map(async file => {
                    try {
                        const content = await fetchFileContent(file.download_url);
                        const { meta, body } = parseFrontMatter(content);
                        return {
                            id: file.name.replace(/\.txt$/, ''),
                            title: meta.title || file.name.replace(/\.txt$/, ''),
                            summary: meta.summary || meta.description || '',
                            date: meta.date || '',
                            tags: meta.tags || [],
                            content: body,
                        };
                    } catch (e) {
                        console.warn('跳过随笔:', file.name, e);
                        return null;
                    }
                });
                const results = await Promise.all(promises);
                allNotes = results.filter(r => r !== null);
                renderNotes();
            } catch (err) {
                console.error('加载随笔失败:', err);
                let detail = escapeHtml(err.message);
                if (err.message.includes('Failed to fetch')) {
                    detail += '<br/><span style="font-size:0.8rem;color:#7a6a5a;">可能原因：网络中断、DNS解析失败，或 API 被拦截。请检查网络连接，或尝试使用 VPN/代理。</span>';
                }
                noteGrid.innerHTML = `
                    <div class="empty">
                        加载失败
                        <div class="error-detail">${detail}</div>
                    </div>
                `;
            }
        }

        // ================================================================
        //  渲染函数（与之前相同）
        // ================================================================
        function renderRecipes() {
            const items = allRecipes;
            let filtered = items;
            if (searchKeyword.trim()) {
                const kw = searchKeyword.trim().toLowerCase();
                filtered = items.filter(item => {
                    return item.ingredients && item.ingredients.some(ing => ing.toLowerCase().includes(kw));
                });
            }

            if (!filtered || filtered.length === 0) {
                recipeGrid.innerHTML = `<div class="empty">暂无菜谱</div>`;
                return;
            }

            const sorted = [...filtered].sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(b.date) - new Date(a.date);
            });

            let html = '';
            for (const item of sorted) {
                const dateStr = item.date ? safeDate(item.date) : '';
                const summary = item.summary || '';
                html += `
                    <div class="card" data-id="${item.id}" data-type="recipe">
                        <span class="type-badge">菜谱</span>
                        <div class="title">${escapeHtml(item.title)}</div>
                        ${dateStr ? `<div class="date">${dateStr}</div>` : ''}
                        ${summary ? `<div class="summary">${escapeHtml(summary)}</div>` : ''}
                    </div>
                `;
            }
            recipeGrid.innerHTML = html;

            recipeGrid.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const item = allRecipes.find(i => i.id === id);
                    if (item) openModal(item);
                });
            });
        }

        function renderNotes() {
            const items = allNotes;
            if (!items || items.length === 0) {
                noteGrid.innerHTML = `<div class="empty">暂无随笔</div>`;
                return;
            }

            const sorted = [...items].sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(b.date) - new Date(a.date);
            });

            let html = '';
            for (const item of sorted) {
                const dateStr = item.date ? safeDate(item.date) : '';
                html += `
                    <div class="entry" data-id="${item.id}" data-type="note">
                        <div class="entry-title">${escapeHtml(item.title)}</div>
                        ${dateStr ? `<div class="entry-date">${dateStr}</div>` : ''}
                    </div>
                `;
            }
            noteGrid.innerHTML = html;

            noteGrid.querySelectorAll('.entry').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const item = allNotes.find(i => i.id === id);
                    if (item) openModal(item);
                });
            });
        }

        // ================================================================
        //  切换视图、搜索、模态框（与之前相同）
        // ================================================================
        function switchView(view) {
            currentView = view;
            tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
            recipeGrid.style.display = (view === 'recipe') ? 'grid' : 'none';
            noteGrid.style.display = (view === 'note') ? 'block' : 'none';
            searchBox.classList.toggle('visible', view === 'recipe');
            if (view === 'recipe') renderRecipes();
        }

        searchInput.addEventListener('input', (e) => {
            searchKeyword = e.target.value;
            if (currentView === 'recipe') renderRecipes();
        });

        function openModal(item) {
            modalTitle.textContent = item.title;
            modalDate.textContent = item.date ? safeDate(item.date) : '';
            modalBody.innerHTML = renderMarkdown(item.content);
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function renderMarkdown(text) {
            if (!text) return '';
            let html = text;
            html = html.replace(/<script[\s\S]*?<\/script>/gi, '');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;" />');
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>');
            html = html.replace(/^[\*\-] (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br />');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<li>([\s\S]*?)<\/li>/g, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul>\s*<ul>/g, '');
            return html;
        }

        modalClose.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const view = btn.dataset.view;
                if (view !== currentView) switchView(view);
            });
        });

        // ================================================================
        //  启动
        // ================================================================
        recipeGrid.style.display = 'grid';
        noteGrid.style.display = 'none';
        searchBox.classList.add('visible');

        loadRecipes();
        loadNotes();

        console.log('✅ 已启动');
        console.log('🔗 请求基础 URL（含分支）:', BASE_URL);
        console.log('🔄 如果仍然 Failed to fetch，请检查浏览器控制台网络请求的详细信息。');
    </script>
