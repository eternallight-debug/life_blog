        }

        ];

        // ============================================================
        // 3. 构建层级布局（手动计算坐标）
        // ============================================================

        // 按代际分组
        const genMap = {};
        people.forEach(p => {
            const g = p.gen || 6;
            if (!genMap[g]) genMap[g] = [];
            genMap[g].push(p);
        });
        const sortedGens = Object.keys(genMap).map(Number).sort((a, b) => a - b);

        // 定义层高和水平间距
        const layerHeight = 110;
        const topMargin = 60;
        const leftMargin = 40;
        const rightMargin = 40;
        const chartWidth = window.innerWidth || 1200;
        const chartHeight = window.innerHeight - 62;

        // 为每个节点计算 x, y
        const nodePositions = {};
        sortedGens.forEach((gen, index) => {
            const nodesInGen = genMap[gen];
            const count = nodesInGen.length;
            // 水平可用宽度
            const usableWidth = chartWidth - leftMargin - rightMargin;
            const spacing = Math.min(120, usableWidth / Math.max(count, 1));
            const totalWidth = (count - 1) * spacing;
            const startX = (chartWidth - totalWidth) / 2;
            const y = topMargin + index * layerHeight;

            nodesInGen.forEach((node, i) => {
                const x = startX + i * spacing;
                nodePositions[node.name] = { x, y };
            });
        });

        // 为所有节点添加坐标
        const nodes = people.map(p => {
            const pos = nodePositions[p.name] || { x: Math.random() * chartWidth, y: Math.random() * chartHeight };
            return {
                name: p.name,
                value: p.gen,
                desc: p.desc || '',
                cat: p.cat || '',
                x: pos.x,
                y: pos.y,
                symbolSize: p.gen <= 4 ? (p.gen === 1 ? 56 : p.gen === 2 ? 50 : p.gen === 3 ? 46 : 42) : 28,
                itemStyle: {
                    color: (() => {
                        const colors = { 1: '#8B1A1A', 2: '#B22222', 3: '#CD5C5C', 4: '#D4847A', 5: '#E8A87C',
                            6: '#B8A090' };
                        return colors[p.gen] || '#B8A090';
                    })(),
                    borderColor: '#f0e0c0',
                    borderWidth: 1.2
                },
                label: {
                    fontSize: p.gen <= 4 ? 12 : 9,
                    fontWeight: p.gen <= 4 ? 600 : 400,
                    color: p.gen <= 4 ? '#2a1a0a' : '#5a4a3a'
                }
            };
        });

        // 边
        const links = rawLinks.map(l => {
            const s = nodes.find(n => n.name === l.source);
            const t = nodes.find(n => n.name === l.target);
            if (!s || !t) {
                console.warn('Missing node:', l.source, l.target);
                return null;
            }
            return {
                source: l.source,
                target: l.target,
                label: l.label || '关系',
                lineStyle: {
                    color: '#8a7a6a',
                    width: 1.5,
                    curveness: 0.1,
                    opacity: 0.7
                }
            };
        }).filter(e => e !== null);

        // ============================================================
        // 4. 图表渲染
        // ============================================================

        const genColors = {
            1: '#8B1A1A',
            2: '#B22222',
            3: '#CD5C5C',
            4: '#D4847A',
            5: '#E8A87C',
            6: '#B8A090'
        };
        const genNames = {
            1: '第1代·宁荣二公',
            2: '第2代·世袭',
            3: '第3代·第三代',
            4: '第4代·玉字辈',
            5: '第5代·草字辈',
            6: '其他·仆役/亲友'
        };

        // 图例
        const legendHtml = Object.keys(genNames).map(k =>
            `<div class="row"><span class="dot" style="background:${genColors[k]};"></span><span class="label">${genNames[k]}</span></div>`
        ).join('');
        document.getElementById('legendGens').innerHTML = legendHtml;

        const chartDom = document.getElementById('chart-box');
        const myChart = echarts.init(chartDom);

        const option = {
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    if (params.dataType === 'node') {
                        const d = params.data;
                        let html = `<div style="font-weight:700;font-size:16px;color:#3d1a0a;">${d.name}</div>`;
                        if (d.desc) {
                            html += `<div style="font-size:13px;color:#5a3a2a;margin-top:4px;max-width:260px;">${d.desc}</div>`;
                        }
                        if (d.cat) {
                            html += `<div style="font-size:12px;color:#8a7a6a;margin-top:2px;">🏷️ ${d.cat}</div>`;
                        }
                        const genLabel = genNames[d.value] || `第${d.value}代`;
                        html += `<div style="font-size:11px;color:#aa9a8a;margin-top:2px;">📍 ${genLabel}</div>`;
                        return html;
                    } else if (params.dataType === 'edge') {
                        const d = params.data;
                        return `<div style="font-weight:600;color:#5a3a2a;">${d.source} → ${d.target}</div>
                                <div style="font-size:13px;color:#8a7a6a;">${d.label || '关系'}</div>`;
                    }
                    return '';
                },
                backgroundColor: 'rgba(255,248,240,0.94)',
                borderColor: '#d4c0b0',
                borderWidth: 1,
                textStyle: { color: '#3d2a1a' },
                padding: [12, 16],
                extraCssText: 'border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);'
            },
            legend: { show: false },
            series: [{
                type: 'graph',
                layout: 'none', // 使用手动坐标
                roam: true,
                draggable: true,
                data: nodes,
                links: links,
                categories: [],
                label: {
                    show: true,
                    position: 'bottom',

                    color: '#3d2a1a',

                },

                        return params.data.label || '';

                    color: '#8a7a6a',
                    backgroundColor: 'rgba(255,248,240,0.7)',

                    opacity: 0.7

                    focus: 'adjacency',

                        width: 3,

                    },
                    itemStyle: {

                    label: {

                        color: '#3d1a0a'
                    }
                },
                itemStyle: {
                    borderColor: '#f0e0c0',
                    borderWidth: 1.5,
                    shadowBlur: 4,
                    shadowColor: 'rgba(0,0,0,0.06)'
                }
            }]
        };

        myChart.setOption(option);
        myChart.resize();

        // ============================================================
        // 5. 交互功能
        // ============================================================
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const resetBtn = document.getElementById('reset-btn');

        function performSearch() {
            const keyword = searchInput.value.trim();
            if (!keyword) { alert('请输入人物姓名'); return; }

            const found = nodes.filter(n => n.name.includes(keyword) || (n.desc && n.desc.includes(keyword)));
            if (found.length === 0) {
                alert(`未找到 "${keyword}" 相关人物`);
                return;
            }

            const target = found[0];
            const dataIndex = nodes.indexOf(target);
            if (dataIndex >= 0) {
                myChart.dispatchAction({
                    type: 'highlight',
                    seriesIndex: 0,
                    dataIndex: dataIndex
                });
                myChart.dispatchAction({
                    type: 'focusNodeAdjacency',
                    seriesIndex: 0,
                    dataIndex: dataIndex
                });
                myChart.dispatchAction({
                    type: 'showTip',
                    seriesIndex: 0,
                    dataIndex: dataIndex
                });
                if (found.length > 1) {
                    const names = found.map(n => n.name).join('、');
                    alert(`找到 ${found.length} 位：${names}，已定位到 "${target.name}"`);
                }
            }
        }

        function resetView() {
            searchInput.value = '';
            myChart.dispatchAction({ type: 'unfocusNodeAdjacency', seriesIndex: 0 });
            myChart.dispatchAction({ type: 'hideTip' });
            myChart.setOption(option, true);
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') performSearch();
            if (e.key === 'Escape') resetView();
        });
        resetBtn.addEventListener('click', resetView);

        window.addEventListener('resize', () => myChart.resize());

        console.log(`📜 家谱树加载完成，共 ${nodes.length} 人，${links.length} 条关系`);
    </script>
