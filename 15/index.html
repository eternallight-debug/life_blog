<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>点击播放</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:#000;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* 图片：固定定位 + inset:0 + margin:auto 实现水平垂直居中；
     width/height 由 JS 精确计算；max-* 作为 JS 失效时的兜底。 */
  #anim {
    position: fixed;
    inset: 0;
    margin: auto;
    display: block;
    pointer-events: none;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;   /* 移动端地址栏兼容 */
  }

  #startBtn {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    padding: 18px 52px;
    font-size: 20px;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.7);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .15s, background .15s;
  }
  #startBtn:active {
    transform: translate(-50%, -50%) scale(.95);
    background: rgba(255,255,255,.2);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <button id="startBtn" type="button">点击播放</button>
  <img id="anim" src="1.webp" alt="" hidden>
  <audio id="audio" src="1.mp3" preload="auto" playsinline loop></audio>

<script>
(function () {
  var btn   = document.getElementById('startBtn');
  var anim  = document.getElementById('anim');
  var audio = document.getElementById('audio');
  var started = false;

  /* 核心：让图片最长边 = 视口最短边，保持原始宽高比居中 */
  function fit() {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var shortSide = Math.min(vw, vh);

    var nw = anim.naturalWidth;
    var nh = anim.naturalHeight;
    if (!nw || !nh) return;

    // 缩放系数：把图片长边缩放到视口最短边
    var k = shortSide / Math.max(nw, nh);
    anim.style.width  = (nw * k) + 'px';
    anim.style.height = (nh * k) + 'px';
  }

  // 图片可能已被缓存，load 事件不会触发，需要主动判断
  if (anim.complete && anim.naturalWidth) fit();
  anim.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  // 预热，点击后立即可显示
  new Image().src = '1.webp';

  function start() {
    if (started) return;
    started = true;

    btn.hidden  = true;
    anim.hidden = false;
    fit();   // 确保尺寸已按当前视口计算

    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (err) {
        console.warn('音频被拦截：', err);
        document.addEventListener('click', function retry() {
          audio.play().catch(function(){});
          document.removeEventListener('click', retry);
        }, { once: true });
      });
    }
    // 不再调用 requestFullscreen()
  }

  btn.addEventListener('click', start);
})();
</script>
</body>
</html>
